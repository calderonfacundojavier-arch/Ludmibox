<script>
"use strict";
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=n=>Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:2})+" cr";
const app=$("#app");
/* ---------- sonido: efectos, música y voces (todo generado en el navegador, sin archivos) ---------- */
const AU={ctx:null,on:Object.assign({sfx:true,music:true,voice:true},JSON.parse(localStorage.getItem("tr_snd")||"{}")),timer:null,step:0,next:0,voices:[]};
function auSave(){localStorage.setItem("tr_snd",JSON.stringify(AU.on))}
function ac(){
  if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.m=AU.ctx.createGain();AU.m.gain.value=.9;AU.m.connect(AU.ctx.destination);AU.mg=AU.ctx.createGain();AU.mg.gain.value=.16;AU.mg.connect(AU.m)}catch(e){return null}}
  if(AU.ctx.state==="suspended")AU.ctx.resume();return AU.ctx}
function tone(f,t,d,v,type,to){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.05)}
function noise(t,d,f,v,q){const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type="bandpass";fl.frequency.value=f;fl.Q.value=q||1;const g=c.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t)}
const SFX={
  card(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;noise(t,.09,2200,.9,.8);tone(150,t,.09,.5,"sine",60)},
  deal(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;for(let i=0;i<3;i++)noise(t+i*.11,.07,3000,.5,1)},
  say(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;tone(660,t,.16,.22,"triangle");tone(990,t+.07,.2,.14,"triangle")},
  point(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;tone(520,t,.1,.2,"square",520)},
  win(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.13,.35,.25,"triangle"))},
  lose(){const c=ac();if(!c||!AU.on.sfx)return;const t=c.currentTime;[392,349,311,262].forEach((f,i)=>tone(f,t+i*.16,.4,.22,"sawtooth"))},
  click(){const c=ac();if(!c||!AU.on.sfx)return;tone(800,c.currentTime,.05,.12,"square")}
};
/* música: guitarra sintética en La menor (Am–F–C–G), suave y en bucle */
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],ARP=[0,1,2,1,2,1,2,1];
const mf=n=>440*Math.pow(2,(n-69)/12);
function pluck(t,f,d,v){const c=AU.ctx,o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.setValueAtTime(2400,t);fl.frequency.exponentialRampToValueAtTime(260,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(AU.mg);o.start(t);o.stop(t+d+.05)}
function musicTick(){
  const c=AU.ctx;if(!c||!AU.on.music){return}
  const beat=60/92/2;if(AU.next<c.currentTime)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.35){
    const i=AU.step,chord=PROG[Math.floor(i/8)%4],t=AU.next;
    pluck(t,mf(chord[ARP[i%8]]+12),.55,.5);
    if(i%8===0){pluck(t,mf(chord[0]-12),1.3,.9);const g=c.createOscillator();}
    if(i%8===4)pluck(t,mf(chord[0]-5),.9,.5);
    AU.step++;AU.next+=beat}
}
function musicOn(){if(!AU.on.music){musicOff();return}if(!ac())return;if(!AU.timer)AU.timer=setInterval(musicTick,120)}
function musicOff(){if(AU.timer){clearInterval(AU.timer);AU.timer=null}}
/* voces: síntesis del navegador, en español rioplatense si el dispositivo la tiene */
function pickVoices(){try{const all=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));all.sort((a,b)=>(/AR/i.test(b.lang)-/AR/i.test(a.lang))||(/MX|US|419/i.test(b.lang)-/MX|US|419/i.test(a.lang)));AU.voices=all}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoices;pickVoices()}catch(e){}
function speak(text,who){
  if(!AU.on.voice||!window.speechSynthesis||!text)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang="es-AR";const vs=AU.voices;if(vs.length)u.voice=vs[who&&vs.length>1?1:0];
    u.rate=who?1.12:1.05;u.pitch=who?.8:1.15;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
const SAY={truco:["","","¡Truco!","¡Retruco!","¡Vale cuatro!"],quiero:"¡Quiero!",noquiero:"No quiero",envido:{envido:"¡Envido!",real:"¡Real envido!",falta:"¡Falta envido!"},mazo:"Me voy al mazo",flor:"¡Flor!"};
function soundPanel(){
  const d=document.createElement("div");d.className="ov";
  const row=(k,t)=>`<div class="sw"><span>${t}</span><input type="checkbox" data-k="${k}" ${AU.on[k]?"checked":""}></div>`;
  d.innerHTML=`<div class="box" style="text-align:left"><h2 style="margin-bottom:8px">Sonido</h2>${row("sfx","Efectos (cartas, cantos)")}${row("music","Música de fondo")}${row("voice","Voces cuando se canta")}<button class="btn" id="sk" style="width:100%;margin-top:14px">Listo</button></div>`;
  app.appendChild(d);
  d.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{AU.on[i.dataset.k]=i.checked;auSave();if(i.dataset.k==="music")i.checked?musicOn():musicOff();if(i.dataset.k==="voice"&&!i.checked)try{speechSynthesis.cancel()}catch(e){};SFX.click()});
  $("#sk").onclick=()=>d.remove();
}
document.addEventListener("pointerdown",()=>{if(AU.on.music)musicOn()},{once:false,passive:true});

let tok=localStorage.getItem("tr_tok"),rtok=localStorage.getItem("tr_rtok"),ME=null,TB=null,poll=null,lastN={},qBusy=false,said=null,clockOff=0;

/* ---------- API ---------- */
async function api(action,body,retry){
  const r=await fetch("/api/truco",{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({error:"Sin conexión"}));
  if(r.status===401&&!retry&&rtok&&action!=="login"&&action!=="refresh"){try{const n=await api("refresh",{refresh_token:rtok},true);setTok(n);return api(action,body,true)}catch(_){logout();throw new Error("Sesión vencida")}}
  if(!r.ok)throw new Error(j.error||"Error");return j;
}
function setTok(s){tok=s.access_token;rtok=s.refresh_token;localStorage.setItem("tr_tok",tok);localStorage.setItem("tr_rtok",rtok)}
function logout(){tok=rtok=null;localStorage.removeItem("tr_tok");localStorage.removeItem("tr_rtok");stopPoll();authView()}
function toast(t,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;app.appendChild(d);setTimeout(()=>d.remove(),ms||2600)}
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
let _sp=null;

/* ---------- cartas ---------- */
const SUIT={E:"Espada",B:"Basto",O:"Oro",C:"Copa"};
const ICON={
 O:'<circle cx="12" cy="12" r="10" fill="currentColor" opacity=".2"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/>',
 C:'<path d="M4 3h16c0 8-3.5 12-8 12S4 11 4 3z" fill="currentColor"/><path d="M12 15v5M7.5 22h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',

function face(n,s){

  else{ // 10 sota · 11 caballo · 12 rey (figuras de dibujo propio)
    const hat={10:'<path d="M21 31q9-13 18 0z" fill="currentColor"/>',11:'<path d="M20 31q10-16 20 0z" fill="currentColor"/><path d="M38 22q8-7 6 5" stroke="currentColor" stroke-width="2" fill="none"/>',12:'<path d="M21 31l2-10 4 6 3-8 3 8 4-6 2 10z" fill="currentColor"/>'}[n];
    body=`<rect x="12" y="14" width="36" height="54" rx="5" fill="currentColor" opacity=".08"/><circle cx="30" cy="38" r="8" fill="#f1c8a0" stroke="currentColor" stroke-width="1.2"/>${hat}<path d="M17 66q3-20 13-20t13 20z" fill="currentColor" opacity=".85"/>${ic(30,60,.0)}${ic(41,22,.6)}<text x="30" y="77" text-anchor="middle" font-size="7.5" font-weight="800" fill="currentColor" opacity=".8">${{10:"SOTA",11:"CABALLO",12:"REY"}[n]}</text>`;

function card(id,cls,click,extra){

/* fósforos del marcador: cada cuadrado = 5 puntos */
function tally(pts,target){
  const groups=Math.ceil(target/5);let o="";
  for(let g=0;g<groups;g++){const k=Math.max(0,Math.min(5,pts-g*5));
    const st=['M2 2H18','M18 2V18','M18 18H2','M2 18V2','M2 18L18 2'];
    o+=`<svg viewBox="0 0 20 20" fill="none" stroke-linecap="round"><rect x="1" y="1" width="18" height="18" rx="3" stroke="#f3d98b" stroke-opacity=".18" stroke-width="1"/>${st.slice(0,k).map(d=>`<path d="${d}" stroke="#fff" stroke-width="2.6"/>`).join("")}</svg>`}
  return`<div class="tally">${o}</div>`;
}

let sayQ=[],sayT=null;
function showSay(evs,names,me){
  sayQ.push(...evs);if(sayT)return;
  const next=()=>{const e=sayQ.shift();
    const bo=$("#bo"),bm=$("#bm"),ban=$("#ban");
    if(!e||!bo){sayT=null;return}
    const el=e.sys?ban:(e.p===me?bm:bo);el.textContent=e.t;el.hidden=false;
    if(e.v){if(!(e.p===me&&Date.now()-voicedSelf<8000)){speak(e.v,e.p!==me);SFX.say()}}else if(e.sys)SFX.point();
    sayT=setTimeout(()=>{
      const pend=TB&&TB.view&&TB.view.hand&&TB.view.hand.pending;
      if(!sayQ.length&&!e.end){if(e.sys||!(pend&&((e.p===me)===(pend.by===me))))el.hidden=true}
      else if(sayQ.length)el.hidden=true;
      sayT=null;next()},sayQ.length?950:2400)};
  next();
}

}

async function move(m){
  if(qBusy||!TB)return;qBusy=true;const t0=Date.now(),vsBot=TB.vsBot;
  try{
    const fan=$("#fan"),bar=$("#bar");
    if(m.type==="play"){ // la carta sale al instante, sin esperar al servidor
      const el=fan&&fan.querySelector(`[data-card="${m.card}"]`),pm=app.querySelector(".play.pm");
      if(el&&pm){seen.add("t"+TB.view.hand.n+":"+m.card);const d=document.createElement("div");d.innerHTML=card(m.card,"nm");pm.appendChild(d.firstChild);el.remove();SFX.card()}
    }else{const vt=voiceFor(m);if(vt){speak(vt,false);voicedSelf=Date.now()}SFX.say()}
    fan&&fan.classList.add("lock");bar&&bar.classList.add("lock");
    if(vsBot){const mesa=app.querySelector(".mesa");if(mesa&&!mesa.querySelector(".think")){const th=document.createElement("div");th.className="think";th.textContent="pensando…";mesa.appendChild(th)}}
    const t=await api("move",{table:TB.table,move:m});
    if(vsBot){const w=520-(Date.now()-t0);if(w>0)await new Promise(r=>setTimeout(r,w))} // la máquina "piensa" un instante
    TB=t;clockOff=new Date(t.serverNow).getTime()-Date.now();render()
  }catch(e){toast(e.message);try{TB=await api("state",{table:TB.table});render()}catch(_){}}
  finally{qBusy=false}
}
function endScreen(){
  const t=TB,won=t.winnerSlot===t.slot,reasons={cartas:"",abandono:"por abandono",tiempo:"por tiempo agotado"};
  setTimeout(()=>won?SFX.win():SFX.lose(),250);
  const d=document.createElement("div");d.className="ov";
  d.innerHTML=`<div class="box"><div class="big">${won?"¡GANASTE!":"Perdiste"}</div><p>${won?"Ganaste":"Ganó "+E(t.names[t.winnerSlot])} ${reasons[t.reason]||""}</p>
  ${t.stake>0?(won?`<p>Te acreditamos <b style="color:#9be7b0">${fm(t.prize)}</b> en tus créditos<br><span class="mut">${t.vsBot?`(pago ×${String(t.payout).replace(".",",")} sobre tu apuesta de ${fm(t.stake)})`:`(pozo ${fm(t.pot)} − comisión ${fm(t.rake)})`}</span></p>`:`<p class="mut">Perdiste tu apuesta de ${fm(t.stake)}.</p>`):`<p class="mut">Partida de práctica.</p>`}
  <button class="btn" id="bk" style="width:100%;margin-top:8px">Volver al inicio</button></div>`;
  app.appendChild(d);$("#bk").onclick=()=>{stopPoll();TB=null;lobby()};
}
/* ---------- inicio ---------- */
function start(){lobby()}
if(tok){start()}else authView();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TB)tick()});
