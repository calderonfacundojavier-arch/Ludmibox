<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chats</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--wall:#0b141a;--out:#005c4b;--accent:#00a884;--muted:#8696a0;--line:#222d34;--hover:#2a3942}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#e9edef;overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
#login{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:20px;background:var(--wall)}
#login>*{width:min(320px,100%);margin:0}
#login input{border:0;border-radius:8px;padding:13px 14px;background:var(--hover);font-size:16px;outline:0}
#login button{border:0;border-radius:8px;padding:13px;background:var(--accent);color:#111b21;font-weight:700;cursor:pointer}
#err{color:#f87171;font-size:13px}
#app{display:flex;height:100%}
#side{width:380px;display:flex;flex-direction:column;border-right:1px solid var(--line);flex:none}
header{height:60px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;flex:none;padding-top:env(safe-area-inset-top)}
header .sp{flex:1}
header button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px}
#dbg{padding:6px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
#list{flex:1;overflow-y:auto}
.c{display:flex;gap:12px;padding:11px 16px;cursor:pointer;align-items:center}
.c:hover,.c.on{background:var(--hover)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;color:#fff}
.ci{flex:1;min-width:0}
.top,.pv{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--muted);flex:none}.c.un .tm{color:var(--accent)}
.pv{color:var(--muted);font-size:14px;margin-top:2px}
.pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--accent);color:#111b21;border-radius:12px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--wall)}
#blank{margin:auto;color:var(--muted);text-align:center;padding:20px}
#pane{display:flex;flex-direction:column;height:100%}
#back{display:none;width:34px;height:34px;border-radius:50%;font-size:20px;color:#e9edef}
#title{cursor:pointer;flex:1}
#msgs{flex:1;overflow-y:auto;padding:14px 5%;display:flex;flex-direction:column;gap:4px}
.m{max-width:min(75%,520px);padding:6px 8px 4px 10px;border-radius:8px;font-size:14.5px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px .5px #0004}
.pcap{display:block;color:#ffffffaa;font-size:11px;margin-bottom:6px}
.pcc{margin-top:8px;padding:8px 10px;border-radius:8px;background:#0005;font-size:13px;line-height:1.5}
.pcc b{display:block}.pcc small{display:block;opacity:.8;margin-top:4px}
.lo{flex:1 1 200px;font-size:14px}
.sysn{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:8px;margin:4px 0;text-align:center}
.m.in{align-self:flex-start;background:var(--panel);border-top-left-radius:0}
.m.out{align-self:flex-end;background:var(--out);border-top-right-radius:0}
.m time{float:right;margin:6px 0 0 10px;font-size:11px;color:#ffffff99}
.m img{max-width:100%;max-height:340px;border-radius:6px;display:block;cursor:pointer;margin-bottom:2px}
.m audio{max-width:100%;height:40px;display:block}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel)}
#txt{flex:1;min-width:0;border:0;border-radius:8px;padding:12px 14px;background:var(--hover);font-size:16px;outline:0}
#send{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#111b21;font-size:18px;cursor:pointer;flex:none}
.ic{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.ic.rec{background:#dc2626;color:#fff;animation:p 1s infinite}@keyframes p{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.ic.rec{animation:none}}
#srch{padding:8px 12px 4px;flex:none}
#q{width:100%;border:0;border-radius:8px;padding:9px 14px;background:var(--hover);color:var(--text,#e9edef);font-size:14px;outline:none}
#q::placeholder{color:var(--muted)}
#tabs{display:flex;gap:6px;padding:6px 12px 10px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
#tabs button{padding:6px 14px;border-radius:18px;background:var(--hover);border:0;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
#tabs button.on{background:#0a332c;color:#25d366}
#tabs button.dot::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#25d366;margin-left:6px}
#snd{padding:6px 16px;font-size:12px;color:#f59e0b;border-bottom:1px solid var(--line);flex:none}
.empty{padding:24px 16px;color:var(--muted);text-align:center;font-size:14px}
#pane header .hb{background:var(--hover);border-radius:8px;padding:8px 12px;color:#e9edef;font-size:13px;font-weight:600;white-space:nowrap}
.m{position:relative}
.m .more{position:absolute;top:1px;right:3px;background:none;border:0;color:#ffffffaa;font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;opacity:.55}
.m .more:hover,.m.sel .more{opacity:1}
.m .act{display:none;gap:8px;margin:6px 0 2px;clear:both}
.m.sel .act{display:flex}
.m .act button{background:#0005;border:0;border-radius:6px;padding:6px 10px;color:#fff;font-size:12px;cursor:pointer}
.m .act .dl{color:#fca5a5}
.sysn.gone{font-style:italic}
/* editor de landing */
#ed{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#edBody{flex:1;overflow-y:auto;padding:16px;width:100%;max-width:760px;margin:0 auto}
#ed header a{color:var(--accent);font-size:13px;text-decoration:none;white-space:nowrap}
.fs{margin-bottom:26px}.fs h3{font-size:14px;color:var(--accent);margin:0 0 6px}
.nt{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.fl{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.fi{width:100%;border:0;border-radius:8px;padding:11px 12px;background:var(--hover);font-size:15px;outline:0}
textarea.fi{min-height:78px;resize:vertical;font-family:inherit}
.li{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.li>.fi{flex:1 1 140px;min-width:0;width:auto}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.th{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--hover);flex:none}
.sm{padding:9px 12px;border:0;border-radius:8px;background:var(--hover);cursor:pointer;font-size:13px}
.sm.del{color:#f87171}.sm:disabled{opacity:.5;cursor:wait}
#ed header .primary{background:var(--accent);color:#111b21;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0;cursor:pointer}
.acc{flex:1 1 100%;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
#edMsg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:11px 16px;border-radius:8px;font-size:14px;max-width:90%;z-index:30;box-shadow:0 4px 20px #0008}
@media(max-width:760px){#side{width:100%}#chat{display:none;position:fixed;inset:0;z-index:5}#app.open #chat{display:flex}#back{display:block}}
</style></head>
<body>
<form id="login"><h2>Panel de atención</h2>
  <input id="em" type="email" placeholder="Correo" required autocomplete="username">
  <input id="pw" type="password" placeholder="Contraseña" required autocomplete="current-password">
  <button>Entrar</button><small id="err"></small></form>

<div id="app" hidden>
  <aside id="side"><header><span>Chats</span><small id="live" hidden style="color:#f59e0b;font-weight:400">⚠ Sin tiempo real, recargá</small><span class="sp"></span><button id="soundBtn" aria-label="Sonido de mensajes nuevos">🔔</button><button id="edLand">⚙ Landing</button><button id="out">Salir</button></header><div id="dbg"></div><div id="snd" hidden>🔕 Tocá cualquier parte de la pantalla para activar el sonido</div><div id="srch"><input id="q" type="search" placeholder="Buscar un chat o iniciar uno nuevo" autocomplete="off" aria-label="Buscar chats"></div><div id="tabs"><button id="tabOpen" class="on">Todos</button><button id="tabUnread">No leídos</button><button id="tabClosed">Cerrados</button></div><div id="list"></div></aside>
  <section id="chat">
    <div id="blank">Seleccioná una conversación<br>para empezar a responder.</div>
    <div id="pane" hidden>
      <header><button id="back" aria-label="Volver">←</button><div class="av" id="hav" style="width:40px;height:40px;font-size:16px"></div><span id="title" title="Tocá para poner un nombre"></span><button class="hb" id="closeChat">✓ Cerrar chat</button></header>
      <div id="msgs"></div>
      <div id="bar"><label class="ic" title="Enviar imagen" tabindex="0">📎<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><button class="ic" id="sendPay" aria-label="Enviar datos para transferir" title="Enviar datos para transferir">💳</button><input id="txt" placeholder="Escribí un mensaje" autocomplete="off" maxlength="2000"><button class="ic" id="mic" aria-label="Grabar audio" title="Grabar audio">🎤</button><button id="send" aria-label="Enviar">➤</button></div>
    </div>
  </section>
</div>

<div id="ed" hidden>
  <header><button id="edBack" aria-label="Volver">←</button><span>Editar landing</span><span class="sp"></span><a href="/ludmi" target="_blank" rel="noopener">Ver landing</a><button id="edSave" class="primary">Guardar cambios</button></header>
  <div id="edBody"></div>
</div>
<div id="edMsg" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://otlrgjezfuwlxqigqpfz.supabase.co", SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bHJnamV6ZnV3bHhxaWdxcGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjY5MDEsImV4cCI6MjEwNjU0MjkwMX0.j_eQn8LafoxQ8WeT4OlBrfFTDvZIV8tO4pGylbGKu7k";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:"agent-auth"}});
const $=id=>document.getElementById(id), all={}, seen=new Set();
let cur=null, rt="conectando…", who="", csOK=true, closed={}, view="open";
const dbg=()=>{$("dbg").hidden=(rt==="activo"&&csOK);$("dbg").textContent=`Agente: ${who} · ${seen.size} mensajes · chats: ${Object.keys(all).length} · tiempo real: ${rt}`+(csOK?"":" · ⚠ falta ejecutar supabase-chat.sql")};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let names={}, lastSeen=LS.get("lastSeen",{});
const MARK="[[CUENTAS]]";
const SEEN="[[CUENTAS_VISTAS]]";
const AUTO="[[RESPUESTA_AUTO]]";
const isSeen=m=>m.sender==="visitor"&&m.kind==="text"&&typeof m.body==="string"&&m.body.startsWith(SEEN);
const isAuto=m=>m.sender==="visitor"&&m.kind==="text"&&typeof m.body==="string"&&m.body.startsWith(AUTO);
const isNote=m=>isSeen(m)||isAuto(m);
const autoData=m=>{try{const d=JSON.parse(m.body.slice(AUTO.length));return d&&typeof d.t==="string"?d:null}catch{return null}};
/* un chat está cerrado hasta que llegue (o envíes) un mensaje nuevo */
const lastReal=id=>{const a=all[id]||[];for(let i=a.length-1;i>=0;i--)if(!isNote(a[i]))return a[i];return null};
const isClosed=id=>{const c=closed[id];if(!c)return false;const l=lastReal(id);return !l||new Date(l.created_at).getTime()<=new Date(c).getTime()};
const isPay=m=>m.sender==="agent"&&m.kind==="text"&&typeof m.body==="string"&&m.body.startsWith(MARK);
const payN=m=>{try{return JSON.parse(m.body.slice(MARK.length)).a.length}catch{return 0}};
const payLabel=m=>"💳 Datos para transferir ("+payN(m)+(payN(m)===1?" cuenta)":" cuentas)");
const nm=id=>names[id]||"Visitante "+id.slice(0,6);
const hue=id=>parseInt(id.slice(0,6),16)%360;
const fmt=(d,full)=>{d=new Date(d);const t=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});return full||d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})};
const unreadN=id=>all[id].filter(m=>m.sender==="visitor"&&!isNote(m)&&new Date(m.created_at)>new Date(lastSeen[id]||0)).length;
const markSeen=id=>{lastSeen[id]=all[id].at(-1).created_at;LS.set("lastSeen",lastSeen)};
let soundOn=LS.get("sound",true), actx=null;
function unlockAudio(){
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
  }catch{}
}
/* el aviso se oculta después del clic, para que la pantalla no se mueva justo al tocar */
addEventListener("click",()=>setTimeout(()=>{if(actx&&actx.state==="running")$("snd").hidden=true},0));
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
function beep(){
  if(!soundOn||!actx||actx.state!=="running")return;
  try{
    const t=actx.currentTime;
    [[880,0],[1175,.14]].forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.22,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.3);
      o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.32)});
  }catch{}
}
function renderSound(){const b=$("soundBtn");b.textContent=soundOn?"🔔":"🔕";b.title=soundOn?"Sonido activado (tocá para silenciar)":"Sonido silenciado (tocá para activar)"}
$("soundBtn").onclick=()=>{soundOn=!soundOn;LS.set("sound",soundOn);renderSound();unlockAudio();if(soundOn)beep()};
renderSound();
function avatar(el,id){el.style.background=`hsl(${hue(id)} 45% 38%)`;el.textContent=names[id]?names[id][0].toUpperCase():"👤"}

$("login").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error)return $("err").textContent="Correo o contraseña incorrectos."; boot()};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session||session.user.is_anonymous)return;
  who=session.user.email;
  const {data:a}=await sb.from("agents").select("user_id");
  if(!a||!a.length){$("err").textContent="Este usuario no es agente.";await sb.auth.signOut();return}
  const {data:cs,error:ce}=await sb.from("contacts").select("*");(cs||[]).forEach(c=>names[c.visitor_id]=c.name);
  {const {data:st,error:se}=await sb.from("chat_state").select("*");if(se)csOK=false;else(st||[]).forEach(c=>closed[c.visitor_id]=c.closed_at)}
  $("login").hidden=true;$("app").hidden=false;
  const pch=sb.channel("agent-presence",{config:{presence:{key:"agent-"+session.user.id}}});
  pch.subscribe(async st=>{if(st==="SUBSCRIBED")await pch.track({at:Date.now()})});
  const {data,error}=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(2000);
  if(error){$("list").textContent="No se pudieron cargar los chats: "+error.message;return}
  data.reverse().forEach(m=>add(m));list();dbg();
  sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{add(p.new,true);list();dbg()})
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},p=>applyUpdate(p.new))
   .subscribe(st=>{rt=st==="SUBSCRIBED"?"activo":st;dbg();$("live").hidden=!(st==="CHANNEL_ERROR"||st==="TIMED_OUT")});
  if(!ce)sb.channel("ctc").on("postgres_changes",{event:"*",schema:"public",table:"contacts"},p=>{
     if(p.eventType==="DELETE")delete names[p.old.visitor_id];else names[p.new.visitor_id]=p.new.name;
     if(cur){$("title").textContent=nm(cur);avatar($("hav"),cur)}list()}).subscribe();
  if(csOK)sb.channel("cst").on("postgres_changes",{event:"*",schema:"public",table:"chat_state"},p=>{
     if(p.eventType==="DELETE")delete closed[p.old.visitor_id];else closed[p.new.visitor_id]=p.new.closed_at;
     renderClose();list()}).subscribe();
  else{$("tabs").hidden=true;$("closeChat").hidden=true;dbg()}
  if(!actx||actx.state!=="running")$("snd").hidden=!soundOn;
  renderClose();
}
function add(m,live){
  if(seen.has(m.id))return;seen.add(m.id);
  (all[m.visitor_id]=all[m.visitor_id]||[]).push(m);
  if(m.visitor_id===cur){
    draw(m);if(live)markSeen(cur);
    if(view==="closed"&&!isClosed(cur))view="open";
    renderClose();
  }
  if(live&&m.sender==="visitor"&&!isNote(m))beep();
}
/* un mensaje editado o eliminado (por vos, desde otro dispositivo o desde este) */
function applyUpdate(m){
  const arr=all[m.visitor_id];if(!arr)return;
  const i=arr.findIndex(x=>x.id===m.id);if(i<0)return;
  arr[i]=Object.assign({},arr[i],m);
  if(m.visitor_id===cur){$("msgs").replaceChildren();arr.forEach(draw)}
  list();dbg();
}
function list(){
  const ids=Object.keys(all);
  const openIds=ids.filter(id=>!isClosed(id)),closedIds=ids.filter(id=>isClosed(id));
  const recent=(a,b)=>new Date(all[b].at(-1).created_at)-new Date(all[a].at(-1).created_at);
  const term=($("q").value||"").trim().toLowerCase();
  const hit=id=>!term||nm(id).toLowerCase().includes(term)||all[id].some(m=>m.kind==="text"&&!m.deleted_at&&!isNote(m)&&String(m.body).toLowerCase().includes(term));
  let base=view==="closed"?closedIds:openIds;
  if(view==="unread")base=openIds.filter(id=>id!==cur&&unreadN(id)>0);
  if(term)base=ids.filter(hit);   /* al buscar se revisan todos los chats, abiertos o cerrados */
  const shown=base.sort(recent);
  $("tabOpen").classList.toggle("on",view==="open");$("tabUnread").classList.toggle("on",view==="unread");$("tabClosed").classList.toggle("on",view==="closed");
  $("tabUnread").classList.toggle("dot",openIds.some(id=>id!==cur&&unreadN(id)>0));
  let total=0;ids.forEach(id=>{if(id!==cur)total+=unreadN(id)});
  const rows=shown.map(id=>{
    const l=all[id].at(-1),n=id===cur?0:unreadN(id);
    const d=document.createElement("div");d.className="c"+(id===cur?" on":"")+(n?" un":"");
    d.innerHTML='<div class="av"></div><div class="ci"><div class="top"><span class="nm"></span><span class="tm"></span></div><div class="pv"><span></span><b class="badge" hidden></b></div></div>';
    avatar(d.querySelector(".av"),id);
    d.querySelector(".nm").textContent=nm(id);d.querySelector(".tm").textContent=fmt(l.created_at);
    const pre=l.deleted_at?"🚫 Mensaje eliminado":isAuto(l)?"🤖 Respuesta automática":isSeen(l)?"💳 Se le mostraron los datos":isPay(l)?payLabel(l):l.kind==="text"?l.body:(l.kind==="image"?"📷 Foto":"🎤 Audio");
    d.querySelector(".pv span").textContent=(l.sender==="agent"?"Vos: ":"")+pre;
    if(n){const b=d.querySelector(".badge");b.hidden=false;b.textContent=n}
    d.onclick=()=>open(id);return d});
  if(!rows.length){const e=document.createElement("div");e.className="empty";e.textContent=term?"No se encontraron chats.":view==="closed"?"No hay chats cerrados.":view==="unread"?"No tenés mensajes sin leer.":"Todavía no hay chats.";rows.push(e)}
  $("list").replaceChildren(...rows);
  document.title=(total?`(${total}) `:"")+"Chats";
}
function renderClose(){if(cur)$("closeChat").textContent=isClosed(cur)?"↩ Reabrir":"✓ Cerrar chat"}
function open(id){
  cur=id;if(isClosed(id))view="closed";else if(view==="closed")view="open";markSeen(id);$("app").classList.add("open");$("blank").hidden=true;$("pane").hidden=false;
  $("title").textContent=nm(id);avatar($("hav"),id);renderClose();
  $("msgs").replaceChildren();all[id].forEach(draw);list();
}
/* mismo mensaje que ve el usuario: texto de presentación + cuentas */
const parsePay=(m,mark)=>{try{const d=JSON.parse(m.body.slice(mark.length));return Array.isArray(d.a)&&d.a.length?d:null}catch{return null}};
function payBox(d,caption){

async function shrink(file,max){
  try{
    const bmp=await createImageBitmap(file),r=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(r===1&&file.size<400*1024)return file;
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/webp",.85));
    return b&&b.size<file.size?b:file;
  }catch{return file}
}
async function uploadSite(file,max){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){say("Usá una imagen JPG, PNG o WebP.");return null}
  const blob=await shrink(file,max);
  if(blob.size>5*1024*1024){say("La imagen sigue pesando más de 5 MB. Probá con una más chica.");return null}
  const ext=blob.type==="image/webp"?"webp":blob.type==="image/png"?"png":"jpg";
  const path=`site/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from("site-assets").upload(path,blob,{contentType:blob.type,cacheControl:"31536000"});
  if(error){say("No se pudo subir la imagen: "+error.message);return null}
  return sb.storage.from("site-assets").getPublicUrl(path).data.publicUrl;
}

      fText("Texto del botón (dejalo vacío para mostrar solo el ícono)","fab_text",{ph:"Chat"}),
      fImg("Ícono propio (opcional)","icon_fab",96)),
    sec("Íconos del chat","Si no subís nada, se usa el emoji que viene por defecto. Para que se vean bien, usá imágenes cuadradas (PNG con fondo transparente).",
      fImg("Micrófono (grabar audio)","icon_mic",96),fImg("Adjuntar imagen","icon_attach",96),
      fImg("Enviar mensaje","icon_send",96),fImg("Datos para transferir (botón del encabezado)","icon_pay",96))
  );
}
/* convierte lo que escribió el agente en un enlace válido, o null */
function cleanIG(raw){
  let u=String(raw||"").trim();if(!u)return "";
  const m=u.match(/^(?:https?:\/\/)?(?:www\.)?instagram\.com\/([A-Za-z0-9._]{1,30})\/?(?:\?.*)?$/i);
  if(m)u=m[1];else u=u.replace(/^@/,"");
  return /^[A-Za-z0-9._]{1,30}$/.test(u)?"https://www.instagram.com/"+u+"/":null;
}
function cleanUrl(raw,webOnly){
  let u=String(raw||"").trim();if(!u)return "";
  if(!webOnly&&/^\+?[\d\s-]{8,18}$/.test(u))return "https://wa.me/"+u.replace(/\D/g,"");
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)&&/^[^\s]+\.[^\s]+$/.test(u))u="https://"+u;
  try{const x=new URL(u);return (webOnly?["https:","http:"]:["https:","http:","mailto:","tel:"]).includes(x.protocol)?x.href:null}catch{return null}
}
function collect(){
  const d=JSON.parse(JSON.stringify(cfg));
  for(const k of ["avatar_url","bg_url"])d[k]=(d[k]||"").trim();
  const ig=cleanIG(d.instagram);
  if(ig===null){say("El Instagram no es válido. Escribí tu usuario (ej. @tuusuario) o el link de tu perfil.");return null}
  d.instagram=ig;d.instagram_icon=(d.instagram_icon||"").trim();
  for(const k of ["icon_attach","icon_mic","icon_send","icon_pay","icon_fab"])d[k]=(d[k]||"").trim();
  d.fab_text=(d.fab_text||"").trim();
  d.chat_theme=d.chat_theme==="dark"?"dark":"light";
  for(const k of ["chat_title","chat_notice","status_online","status_offline","greeting"])d[k]=(d[k]||"").trim();
  const qk=[];
  for(const q of d.quick){
    if(!q||!(q.label||"").trim())continue;
    const action=["pay","reply"].includes(q.action)?q.action:"message",reply=(q.reply||"").trim().slice(0,600);
    if(action==="reply"&&!reply){say("El botón «"+q.label.trim()+"» muestra una respuesta automática, pero no escribiste el texto.");return null}
    qk.push({label:q.label.trim(),text:(q.text||"").trim(),action,reply:action==="reply"?reply:""});
  }
  d.quick=qk;
  d.features=d.features.map(f=>({t:f.t.trim(),s:f.s.trim()}));
  d.layout=normLayout(d.layout);
  d.faq_title=(d.faq_title||"").trim();
  const fq=[];
  for(const x of d.faq){
    const q=(x.q||"").trim(),a=(x.a||"").trim();
    if(!q&&!a)continue;
    if(!q||!a){say("Cada desplegable necesita un título y una explicación. Revisá «"+(q||a.slice(0,30))+"».");return null}
    fq.push({q,a});
  }
  d.faq=fq;
  const out=[];
  for(const c of d.contacts){
    const type=["whatsapp","instagram","chat","link"].includes(c.type)?c.type:"link";
    const label=(c.label||"").trim(),raw=(c.url||"").trim(),icon=(c.icon||"").trim();
    if(type==="chat"){out.push({type,label:label||"Chat en vivo",url:"",icon});continue}
    if(!label&&!raw)continue;
    const u=type==="instagram"?cleanIG(raw):cleanUrl(raw);
    const lab=label||(type==="whatsapp"?"WhatsApp":type==="instagram"?"Instagram":"");
    if(!lab||!u){say("Revisá el botón «"+(lab||raw)+"»: necesita un texto y un enlace o número válido.");return null}
    out.push({type,label:lab,url:u,icon});
  }
  d.contacts=out;
  for(const k of ["platforms","games"]){
    const list=[];
    for(const it of d[k]){
      if(!it.img)continue;
      const raw=(it.url||"").trim(),u=cleanUrl(raw,true);
      if(raw&&!u){say("El link de «"+((it.name||"").trim()||"una imagen")+"» no es válido. Tiene que empezar con https://");return null}
      list.push({name:(it.name||"").trim(),img:it.img,url:u||""});
    }
    d[k]=list;
  }
  return d;
}
function collectPay(){
  const d={intro:(pay.intro||"").trim(),auto_show:!!pay.auto_show,accounts:[]};
  for(const a of pay.accounts){
    const x={label:(a.label||"").trim(),holder:(a.holder||"").trim(),cbu:(a.cbu||"").replace(/[\s-]/g,""),
      alias:(a.alias||"").trim(),note:(a.note||"").trim(),on:!!a.on};
    if(!x.label&&!x.holder&&!x.cbu&&!x.alias)continue;
    const nm=x.label||x.holder||"una cuenta";
    if(x.cbu&&!/^\d{22}$/.test(x.cbu)){say("El CBU/CVU de «"+nm+"» debe tener exactamente 22 números.");return null}
    if(x.alias&&!/^[A-Za-z0-9._-]{6,20}$/.test(x.alias)){say("El alias de «"+nm+"» no es válido (6 a 20 caracteres, sin espacios).");return null}
    if(!x.cbu&&!x.alias){say("«"+nm+"» necesita CBU/CVU o alias.");return null}
    d.accounts.push(x);
  }
  return d;
}
async function saveLanding(){
  const data=collect();if(!data)return;
  const pdata=collectPay();if(!pdata)return;
  const b=$("edSave");b.disabled=true;b.textContent="Guardando…";
  const now=new Date().toISOString();
  const {error}=await sb.from("site_settings").upsert([{key:"landing",data,updated_at:now},{key:"payments",data:pdata,updated_at:now}]);
  b.disabled=false;b.textContent="Guardar cambios";
  if(error)return say("No se pudo guardar: "+error.message);
  cfg=mergeL(data);pay=mergePay(pdata);dirty=false;say("Guardado. Ya se ve en la landing.");buildForm();
}
async function openEditor(){
  $("ed").hidden=false;$("edBody").textContent="Cargando…";
  const {data,error}=await sb.from("site_settings").select("key,data").in("key",["landing","payments"]);
  if(error){$("edBody").textContent="No se pudo cargar: "+error.message+". ¿Ejecutaste supabase-landing.sql?";return}
  const row=k=>((data||[]).find(r=>r.key===k)||{}).data;
  cfg=mergeL(row("landing"));pay=mergePay(row("payments"));dirty=false;buildForm();
}
async function sendPayInfo(){
  if(!cur)return;
  const {data,error}=await sb.from("site_settings").select("data").eq("key","payments").maybeSingle();
  if(error){say("No se pudieron leer las cuentas: "+error.message);return}
  const d=(data&&data.data)||{};
  const act=(Array.isArray(d.accounts)?d.accounts:[]).filter(a=>a&&a.on&&(a.cbu||a.alias));
  if(!act.length){say("No hay cuentas activas. Cargalas en ⚙ Landing > Datos para transferir.");return}
  const mk=drop=>MARK+JSON.stringify({i:d.intro||"",a:act.map(a=>[a.label||"",a.holder||"",a.cbu||"",a.alias||"",drop?"":(a.note||"")])});
  let body=mk(false);if(body.length>1900)body=mk(true);
  if(body.length>1900){say("Son demasiadas cuentas activas para un solo mensaje. Desactivá alguna.");return}
  if(!confirm("¿Enviar los datos de "+act.length+(act.length===1?" cuenta":" cuentas")+" a este contacto?"))return;
  const r=await sb.from("messages").insert({visitor_id:cur,sender:"agent",kind:"text",body});
  say(r.error?"No se pudo enviar: "+r.error.message:"Enviado.");
}
async function patchMsg(m,patch,errTxt){
  const {data,error}=await sb.from("messages").update(patch).eq("id",m.id).select();
  if(error||!data||!data.length){
    alert(errTxt+". Revisá que hayas ejecutado supabase-chat.sql en Supabase (está explicado en el LEEME).");return}
  applyUpdate(data[0]);
}
async function editMsg(m){
  const v=prompt("Editar mensaje (el usuario va a ver el cambio):",m.body);
  if(v===null)return;const body=v.trim();
  if(!body||body===m.body)return;
  await patchMsg(m,{body,edited_at:new Date().toISOString()},"No se pudo editar el mensaje");
}
async function delMsg(m){
  if(!confirm("¿Eliminar este mensaje? También desaparece de la pantalla del usuario."))return;
  const p={deleted_at:new Date().toISOString()};if(m.kind==="text")p.body="";
  await patchMsg(m,p,"No se pudo eliminar el mensaje");
}
async function setClosed(id,on){
  if(!csOK){alert("Para cerrar chats ejecutá supabase-chat.sql en Supabase (está explicado en el LEEME).");return}
  const l=lastReal(id),at=l?l.created_at:new Date().toISOString();
  const r=on?await sb.from("chat_state").upsert({visitor_id:id,closed_at:at}):await sb.from("chat_state").delete().eq("visitor_id",id);
  if(r.error){alert("No se pudo actualizar el chat: "+r.error.message);return}
  if(on){closed[id]=at;cur=null;view="open";$("app").classList.remove("open");$("pane").hidden=true;$("blank").hidden=false}
  else{delete closed[id];view="open";renderClose()}
  list();
}
$("closeChat").onclick=()=>{if(cur)setClosed(cur,!isClosed(cur))};
$("tabOpen").onclick=()=>{view="open";list()};
$("tabClosed").onclick=()=>{view="closed";list()};
$("tabUnread").onclick=()=>{view="unread";list()};
$("q").oninput=()=>list();
$("sendPay").onclick=sendPayInfo;
$("edLand").onclick=openEditor;
$("edSave").onclick=saveLanding;
$("edBack").onclick=()=>{if(dirty&&!confirm("Tenés cambios sin guardar. ¿Salir igual?"))return;$("ed").hidden=true};

boot();
</script></body></html>
