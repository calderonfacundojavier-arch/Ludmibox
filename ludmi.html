<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cajas Online</title>
<style>
:root{--bg:#0b0414;--pink:#d41cd8;--gold:#ffd21f;--card:rgba(20,6,34,.75)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 50% -10%,#6a0f8f,transparent 60%),radial-gradient(700px 500px at 100% 100%,#8a1050,transparent 55%),var(--bg)}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,4,20,.5),rgba(11,4,20,.88))}
.wrap{max-width:420px;margin:0 auto;padding:28px 16px 60px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;border:3px solid var(--pink);margin:0 auto 6px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#ffb800,#a0198a);box-shadow:0 0 24px #d41cd8aa;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{color:var(--pink);font-size:12px;letter-spacing:.3em;font-weight:800}
h1{font-size:34px;line-height:1;margin:14px 0;font-weight:900;text-transform:uppercase;overflow-wrap:anywhere}
.bonus{border:1px solid var(--pink);border-radius:18px;background:var(--card);padding:16px 10px;margin-bottom:14px;box-shadow:0 0 22px #d41cd855}
.bonus small{display:block;font-size:11px;font-weight:700}
.bonus b{display:block;color:var(--gold);font-size:44px;line-height:.95;font-weight:900;margin:6px 0;text-transform:uppercase;overflow-wrap:anywhere}
.cta{width:100%;border:0;border-radius:40px;padding:17px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(#22c55e,#15803d);cursor:pointer;text-transform:uppercase;box-shadow:0 0 20px #22c55e66}
.cta:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{margin:12px 0;padding:10px 14px;border:1px solid #14b86a66;border-radius:12px;font-size:12px;color:#34f5a0;background:var(--card)}
.contacts{display:grid;gap:8px;margin:12px 0}
.contacts a{display:block;padding:12px;border:1px solid var(--pink);border-radius:30px;color:#fff;text-decoration:none;font-weight:800;font-size:14px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid div{border:1px solid var(--pink);border-radius:12px;padding:12px 6px;background:var(--card);font-size:12px;font-weight:800}
.grid span{display:block;font-weight:400;color:#c9c0d2;margin-top:4px;font-size:11px}
.sec{margin:18px 0}
.sec h2{font-size:12px;letter-spacing:.18em;margin:0 0 8px;text-transform:uppercase}
.row{display:flex;gap:12px;overflow-x:auto;padding:12px;border:1px solid var(--pink);border-radius:14px;background:var(--card)}
.item{flex:none;width:84px;font-size:11px;font-weight:800;overflow-wrap:anywhere;color:inherit;text-decoration:none;display:block}
a.item:hover img{filter:brightness(1.15)}
.item img{width:72px;height:72px;object-fit:cover;display:block;margin:0 auto 6px;border:2px solid var(--pink);border-radius:14px;background:#150626}
.row.round .item img{border-radius:50%}
footer{font-size:11px;color:#b8aec4;margin-top:26px;line-height:1.6}
/* datos de transferencia dentro del chat */
.m.card{max-width:96%;align-self:stretch}
.acct{margin-top:8px;padding:8px;border-radius:10px;background:#0006}
.acct b{display:block;margin-bottom:2px}
.kv{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:5px;font-size:13px}
.kv code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.cp{border:0;border-radius:8px;padding:6px 10px;background:#3a1260;color:#fff;cursor:pointer;font-size:12px;flex:none}
/* chat */
#chat{position:fixed;right:16px;bottom:16px;width:360px;height:520px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:#150626;border:1px solid var(--pink);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #000a;z-index:9}
@media(max-width:520px){#chat{inset:0;width:auto;height:auto;max-height:none;border-radius:0}}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#2a0a45;font-weight:800;padding-top:max(14px,env(safe-area-inset-top))}
#chat header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.35;word-wrap:break-word;text-align:left}
.m.visitor{align-self:flex-end;background:#16803d}
.m.agent{align-self:flex-start;background:#3a1260}
.m img{max-width:100%;border-radius:8px;display:block}.m audio{max-width:100%}
.m time{display:block;font-size:10px;opacity:.6;margin-top:3px}
#bar{display:flex;gap:6px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#2a0a45;align-items:center}
#bar input[type=text]{flex:1;min-width:0;border:0;border-radius:20px;padding:11px 14px;font-size:16px;background:#150626;color:#fff}
.ic{width:40px;height:40px;border:0;border-radius:50%;background:#3a1260;color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
.ic.rec{background:#dc2626;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.ic.rec{animation:none}}
</style></head>
<body>
<div id="bg" hidden></div>
<main class="wrap">
  <div class="avatar" id="av" aria-hidden="true">👑</div>
  <div class="name" id="nm"></div>
  <h1 id="ttl"></h1>
  <div class="bonus"><small id="b1"></small><b id="b2"></b><small id="b3"></small></div>
  <button class="cta" id="open"></button>
  <div class="status" id="st"></div>
  <div class="contacts" id="ct" hidden></div>
  <div class="grid" id="feat"></div>
  <section class="sec" id="plat" hidden><h2 id="platT"></h2><div class="row round" id="platRow"></div></section>
  <section class="sec" id="gms" hidden><h2 id="gmsT"></h2><div class="row" id="gmsRow"></div></section>
  <footer><span id="f1"></span><br><span id="f2"></span></footer>
</main>

<section id="chat" hidden aria-label="Chat">
  <header><span id="ctitle"></span><span><button id="pay" hidden title="Datos para transferir" aria-label="Datos para transferir">💳</button><button id="close" aria-label="Cerrar chat">✕</button></span></header>
  <div id="msgs"></div>
  <div id="bar">
    <label class="ic" title="Adjuntar imagen" tabindex="0">📎<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
    <input id="txt" type="text" placeholder="Escribí tu mensaje…" autocomplete="off" maxlength="2000">
    <button class="ic" id="mic" title="Grabar audio" aria-label="Grabar audio">🎤</button>
    <button class="ic" id="send" title="Enviar" aria-label="Enviar">➤</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://otlrgjezfuwlxqigqpfz.supabase.co", SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bHJnamV6ZnV3bHhxaWdxcGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjY5MDEsImV4cCI6MjEwNjU0MjkwMX0.j_eQn8LafoxQ8WeT4OlBrfFTDvZIV8tO4pGylbGKu7k";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), seen=new Set();
let uid=null, ready=null;

/* ---------- contenido editable (se cambia desde el panel /admin) ---------- */
const DEF={
  avatar_url:"", name:"LUDMI", title:"Tu bono de bienvenida",
  bonus_top:"Hasta 50% de bono", bonus_big:"Hasta 50% de bono", bonus_bottom:"Consultá condiciones por el chat",
  cta:"Quiero mi bono ahora", status:"Caja asignada: Caja Ludmi · Atención por chat", bg_url:"",
  features:[{t:"Pagos rápidos",s:"Por transferencia"},{t:"Atención por chat",s:"Respondemos acá"},{t:"Retiros",s:"Consultá condiciones"}],
  contacts:[], platforms_title:"Plataformas", platforms:[], games_title:"Juegos", games:[],
  footer:"Solo mayores de 18 años. El juego puede generar adicción: jugá con responsabilidad.",
  license:"Autorización: [COMPLETAR]", chat_title:"Chat con Caja Ludmi", greeting:"¡Hola! ¿En qué te puedo ayudar?"
};
let CFG=DEF;
function merge(c){
  const o={};
  for(const k in DEF){const v=c&&c[k];
    o[k]=(typeof v===typeof DEF[k]&&v!==null&&(!Array.isArray(DEF[k])||Array.isArray(v)))?v:DEF[k]}
  return o;
}
/* Solo se aceptan enlaces http(s) (y mailto/tel en contactos): nunca javascript: */
function safe(u,schemes){
  try{const x=new URL(String(u||""),location.href);return (schemes||["https:","http:"]).includes(x.protocol)?x.href:null}catch{return null}
}
function txt(id,v){const e=$(id);e.textContent=v;e.hidden=!v}
function mkImg(src,alt){
  const u=safe(src);if(!u)return null;
  const i=document.createElement("img");i.src=u;i.alt=alt||"";i.loading="lazy";i.decoding="async";return i;
}
function fillRow(sec,row,items){
  const list=(items||[]).filter(it=>it&&safe(it.img));
  row.replaceChildren(...list.map(it=>{
    const link=safe(it.url);
    const d=document.createElement(link?"a":"div");d.className="item";
    if(link){d.href=link;d.target="_blank";d.rel="noopener noreferrer"}
    d.append(mkImg(it.img,it.name));
    const n=document.createElement("span");n.textContent=it.name||"";d.append(n);return d}));
  sec.hidden=!list.length;
}
function apply(c){
  CFG=c;
  txt("nm",c.name);txt("ttl",c.title);txt("b1",c.bonus_top);txt("b2",c.bonus_big);txt("b3",c.bonus_bottom);
  $("open").textContent=c.cta;txt("st",c.status);txt("f1",c.footer);txt("f2",c.license);
  $("ctitle").textContent="💬 "+c.chat_title;
  const av=$("av"),ai=mkImg(c.avatar_url,c.name);av.replaceChildren();
  if(ai)av.append(ai);else av.textContent="👑";
  const bu=safe(c.bg_url);$("bg").hidden=!bu;$("bg").style.backgroundImage=bu?`url("${bu}")`:"";
  $("feat").replaceChildren(...c.features.filter(f=>f&&f.t).map(f=>{
    const d=document.createElement("div");d.append(f.t);
    if(f.s){const s=document.createElement("span");s.textContent=f.s;d.append(s)}return d}));
  const links=c.contacts.map(k=>({l:k&&k.label,u:safe(k&&k.url,["https:","http:","mailto:","tel:"])})).filter(k=>k.u&&k.l);
  $("ct").replaceChildren(...links.map(k=>{
    const a=document.createElement("a");a.href=k.u;a.textContent=k.l;a.target="_blank";a.rel="noopener noreferrer";return a}));
  $("ct").hidden=!links.length;
  txt("platT",c.platforms_title);fillRow($("plat"),$("platRow"),c.platforms);
  txt("gmsT",c.games_title);fillRow($("gms"),$("gmsRow"),c.games);
  $("plat").hidden=$("plat").hidden||!c.platforms.length;
  $("gms").hidden=$("gms").hidden||!c.games.length;
}
let cached=null;try{cached=JSON.parse(localStorage.getItem("landing"))}catch{}
apply(merge(cached));
sb.from("site_settings").select("data").eq("key","landing").maybeSingle().then(({data,error})=>{
  if(error||!data||!data.data)return;
  try{localStorage.setItem("landing",JSON.stringify(data.data))}catch{}
  apply(merge(data.data));
});

/* ---------- datos para transferir (solo los ve quien abre el chat) ---------- */
let PAY=null;
async function loadPay(){
  const {data,error}=await sb.from("site_settings").select("data").eq("key","payments").maybeSingle();
  if(error||!data||!data.data)return;
  const d=data.data;
  PAY={intro:typeof d.intro==="string"?d.intro:"",auto:d.auto_show!==false,
    accounts:(Array.isArray(d.accounts)?d.accounts:[]).filter(a=>a&&a.on&&(a.cbu||a.alias))};
  $("pay").hidden=!PAY.accounts.length;
}
function copyBtn(v){
  const b=document.createElement("button");b.className="cp";b.type="button";b.textContent="Copiar";
  b.onclick=async()=>{
    try{await navigator.clipboard.writeText(v)}catch{
      const t=document.createElement("textarea");t.value=v;document.body.append(t);t.select();
      try{document.execCommand("copy")}catch{}t.remove()}
    b.textContent="Copiado ✓";setTimeout(()=>b.textContent="Copiar",1500);
  };
  return b;
}
function kv(label,v){
  const r=document.createElement("div");r.className="kv";
  const s=document.createElement("span");s.append(label+": ");
  const c=document.createElement("code");c.textContent=v;s.append(c);r.append(s,copyBtn(v));return r;
}
function showPay(){
  if(!PAY||!PAY.accounts.length)return;
  const old=$("payCard");if(old)old.remove();
  const box=document.createElement("div");
  if(PAY.intro){const p=document.createElement("div");p.textContent=PAY.intro;box.append(p)}
  PAY.accounts.forEach(a=>{
    const d=document.createElement("div");d.className="acct";
    if(a.label){const b=document.createElement("b");b.textContent=String(a.label);d.append(b)}
    if(a.holder){const h=document.createElement("div");h.textContent="Titular: "+a.holder;d.append(h)}
    if(a.cbu)d.append(kv("CBU/CVU",String(a.cbu)));
    if(a.alias)d.append(kv("Alias",String(a.alias)));
    if(a.note){const n=document.createElement("small");n.textContent=String(a.note);d.append(n)}
    box.append(d);
  });
  const m=bubble({sender:"agent",kind:"text",created_at:new Date()},box);m.id="payCard";m.classList.add("card");
}
$("pay").onclick=showPay;

/* ---------- chat ---------- */
function init(){
  return ready||(ready=(async()=>{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously(); if(r.error){console.error(r.error);alert("El chat no está disponible por ahora.\n\nDetalle técnico: "+r.error.message+(r.error.status?" (código "+r.error.status+")":""));ready=null;return}; session=r.data.session}
    uid=session.user.id;
    const {data}=await sb.from("messages").select("*").eq("visitor_id",uid).order("created_at");
    if((!data||!data.length)&&CFG.greeting) bubble({sender:"agent",kind:"text",body:CFG.greeting,created_at:new Date()});
    (data||[]).forEach(render);
    await loadPay();
    if(PAY&&PAY.auto&&!(data&&data.length))showPay();
    sb.channel("m-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"visitor_id=eq."+uid},p=>render(p.new)).subscribe();
  })());
}
function bubble(m,el){
  const d=document.createElement("div"); d.className="m "+m.sender;
  if(el) d.appendChild(el); else d.textContent=m.body;
  const t=document.createElement("time"); t.textContent=new Date(m.created_at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  d.appendChild(t); $("msgs").appendChild(d); $("msgs").scrollTop=1e9; return d;
}
async function render(m){
  if(seen.has(m.id))return; seen.add(m.id);
  if(m.kind==="text") return bubble(m);
  const {data}=await sb.storage.from("chat-media").createSignedUrl(m.media_path,3600);
  const el=document.createElement(m.kind==="image"?"img":"audio"); el.src=data?data.signedUrl:""; if(m.kind==="audio")el.controls=true;
  bubble(m,el);
}
async function sendText(){
  const body=$("txt").value.trim(); if(!body||!uid)return; $("txt").value="";
  const {error}=await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind:"text",body});
  if(error){alert("No se pudo enviar. Probá de nuevo.");$("txt").value=body}
}
async function upload(blob,kind,mime){
  const path=`${uid}/${Date.now()}.${mime.split("/")[1]}`;
  const {error}=await sb.storage.from("chat-media").upload(path,blob,{contentType:mime});
  if(error)return alert("No se pudo enviar el archivo.");
  await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind,media_path:path});
}
$("open").onclick=async()=>{$("chat").hidden=false;await init();$("txt").focus()};
$("close").onclick=()=>$("chat").hidden=true;
$("send").onclick=sendText;
$("txt").onkeydown=e=>{if(e.key==="Enter")sendText()};
$("file").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||!uid)return;
  if(f.size>5*1024*1024)return alert("La imagen supera los 5 MB.");
  await upload(f,"image",f.type);
};
let rec,chunks,timer;
$("mic").onclick=async()=>{
  if(!uid)return;
  if(rec&&rec.state==="recording"){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";
    rec=new MediaRecorder(s,{mimeType:mime}); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{clearTimeout(timer);s.getTracks().forEach(t=>t.stop());$("mic").classList.remove("rec");
      const b=new Blob(chunks,{type:mime}); if(b.size>1000) await upload(b,"audio",mime)};
    rec.start(); $("mic").classList.add("rec"); timer=setTimeout(()=>rec.stop(),120000);
  }catch{alert("Permití el acceso al micrófono para enviar audios.")}
};
</script>
</body></html>
