function mkImg(src,alt){

  const i=document.createElement("img");i.src=u;i.alt=alt||"";i.loading="lazy";i.decoding="async";return i;
}
/* Íconos genéricos (no son los logos de las marcas). Cada botón puede usar un ícono propio subido desde el panel. */
const ICONS={
  whatsapp:[["path",{d:"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"}]],
  instagram:[["rect",{x:3,y:4,width:18,height:16,rx:3}],["circle",{cx:9,cy:9.5,r:1.6}],["path",{d:"M3 17l5-5 4 4 3-3 6 6"}]],
  chat:[["path",{d:"M4 5h16v11H9l-5 4z"}]],
  link:[["path",{d:"M7 17L17 7M9 7h8v8"}]]
};
function iconEl(k){
  const custom=mkImg(k.icon,"");
  if(custom)return custom;
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("fill","none");svg.setAttribute("stroke","currentColor");
  svg.setAttribute("stroke-width","2");svg.setAttribute("stroke-linecap","round");svg.setAttribute("stroke-linejoin","round");
  svg.setAttribute("aria-hidden","true");
  (ICONS[k.type]||ICONS.link).forEach(([tag,at])=>{const n=document.createElementNS(NS,tag);for(const a in at)n.setAttribute(a,at[a]);svg.append(n)});
  return svg;
}
function fillRow(sec,row,items){
  const list=(items||[]).filter(it=>it&&safe(it.img));
  row.replaceChildren(...list.map(it=>{
    const link=safe(it.url);
    const d=document.createElement(link?"a":"div");d.className="item";
    if(link){d.href=link;d.target="_blank";d.rel="noopener noreferrer"}
    d.append(mkImg(it.img,it.name));
    const n=document.createElement("span");n.textContent=it.name||"";d.append(n);return d}));
  sec.hidden=!list.length;
}
function apply(c){
  CFG=c;
  txt("nm",c.name);txt("ttl",c.title);txt("b1",c.bonus_top);txt("b2",c.bonus_big);txt("b3",c.bonus_bottom);
  $("open").textContent=c.cta;txt("st",c.status);txt("f1",c.footer);txt("f2",c.license);
  $("ctitle").textContent=c.chat_title;
  $("chat").className=c.chat_theme==="dark"?"dark":"light";
  {const cv=$("cav"),ci=mkImg(c.avatar_url,"");cv.replaceChildren();if(ci)cv.append(ci);else cv.textContent="👑"}
  renderStatus();renderQuick();
  const av=$("av"),ai=mkImg(c.avatar_url,c.name);av.replaceChildren();
  if(ai)av.append(ai);else av.textContent="👑";
  [["icAttach",c.icon_attach,"📎"],["icMic",c.icon_mic,"🎤"],["icSend",c.icon_send,"➤"],["icPay",c.icon_pay,"💳"]].forEach(([id,u,emo])=>{
    const sp=$(id),im=mkImg(u,"");sp.replaceChildren();if(im)sp.append(im);else sp.textContent=emo});
  $("fabT").textContent=c.fab_text;
  {const sp=$("icFab"),im=mkImg(c.icon_fab,"");sp.replaceChildren();if(im)sp.append(im);else sp.textContent="💬"}
  syncFab();
  const bu=safe(c.bg_url);$("bg").hidden=!bu;$("bg").style.backgroundImage=bu?`url("${bu}")`:"";
  $("feat").replaceChildren(...c.features.filter(f=>f&&f.t).map(f=>{
    const d=document.createElement("div");d.append(f.t);
    if(f.s){const s=document.createElement("span");s.textContent=f.s;d.append(s)}return d}));
  const ig=safe(c.instagram),items=[];
  if(ig)items.push({type:"instagram",l:"Instagram",u:ig,icon:c.instagram_icon});
  c.contacts.forEach(k=>{
    if(!k||typeof k!=="object")return;
    const type=["whatsapp","instagram","chat","link"].includes(k.type)?k.type:"link";
    if(type==="chat"){if(k.label)items.push({type,l:k.label,icon:k.icon});return}
    const u=safe(k.url,["https:","http:","mailto:","tel:"]);
    if(u&&k.label)items.push({type,l:k.label,u,icon:k.icon});
  });
  $("ct").replaceChildren(...items.map(k=>{
    const chat=k.type==="chat",e=document.createElement(chat?"button":"a");e.className="cbtn";
    if(chat){e.type="button";e.onclick=()=>$("open").click()}
    else{e.href=k.u;e.target="_blank";e.rel="noopener noreferrer"}
    e.append(iconEl(k));
    const t=document.createElement("span");t.textContent=k.l;e.append(t);return e}));
  $("ct").hidden=!items.length;
  txt("platT",c.platforms_title);fillRow($("plat"),$("platRow"),c.platforms);
  txt("gmsT",c.games_title);fillRow($("gms"),$("gmsRow"),c.games);
  $("plat").hidden=$("plat").hidden||!c.platforms.length;
  $("gms").hidden=$("gms").hidden||!c.games.length;
  /* desplegables (por ejemplo "Retiros"): se abren y cierran al tocarlos */
  txt("faqT",c.faq_title);
  const qs=c.faq.filter(x=>x&&typeof x==="object"&&String(x.q||"").trim()&&String(x.a||"").trim()).slice(0,12);
  $("faqList").replaceChildren(...qs.map(x=>{
    const d=document.createElement("details"),s=document.createElement("summary"),a=document.createElement("div");
    s.textContent=String(x.q).slice(0,140);a.className="ans";a.textContent=String(x.a).slice(0,1200);d.append(s,a);return d}));
  $("faq").hidden=!qs.length;
  /* orden y visibilidad de las secciones, según lo que se eligió en el panel */
  c.layout.forEach(it=>{const b=$("b-"+it.id);b.hidden=!it.on;$("blocks").append(b)});
}
/* botón flotante: aparece cuando el botón verde sale de la pantalla (o siempre, si se elige así) y se oculta con el chat abierto */
let ctaVis=("IntersectionObserver" in window);
function syncFab(){$("fab").hidden=!(CFG.fab_on&&$("chat").hidden&&(CFG.fab_always||!ctaVis))}
if("IntersectionObserver" in window)new IntersectionObserver(es=>{ctaVis=es[0].isIntersecting;syncFab()}).observe($("open"));
$("fab").onclick=()=>$("open").click();
/* vista previa dentro del editor del panel (mismo sitio): recibe la configuración en vivo y no usa el chat real */
const PREVIEW=new URLSearchParams(location.search).has("preview")&&window.parent!==window;
if(PREVIEW){
  addEventListener("message",e=>{
    if(e.origin!==location.origin||e.source!==window.parent||!e.data)return;
    if(e.data.type==="preview-cfg"&&e.data.cfg&&typeof e.data.cfg==="object"){apply(merge(e.data.cfg));if(!$("chat").hidden)previewChat()}
    if(e.data.type==="preview-chat"){if(e.data.open){$("chat").hidden=false;previewChat()}else $("chat").hidden=true;syncFab()}
  });
}
function previewChat(){
  const m=$("msgs");m.replaceChildren();
  if(CFG.chat_notice){const n=document.createElement("div");n.className="sys";n.textContent=CFG.chat_notice;m.append(n)}
  String(CFG.greeting||"").split(/\n\s*\n/).map(g=>g.trim()).filter(Boolean).forEach(g=>bubble({sender:"agent",kind:"text",body:g,created_at:new Date()}));
  syncFab();
}
let cached=null;if(!PREVIEW)try{cached=JSON.parse(localStorage.getItem("landing"))}catch{}
apply(merge(cached));
if(!PREVIEW)sb.from("site_settings").select("data").eq("key","landing").maybeSingle().then(({data,error})=>{
  if(error||!data||!data.data)return;
  try{localStorage.setItem("landing",JSON.stringify(data.data))}catch{}
  apply(merge(data.data));
});

/* ---------- datos para transferir (solo los ve quien abre el chat) ---------- */
let PAY=null;
async function loadPay(){
  const {data,error}=await sb.from("site_settings").select("data").eq("key","payments").maybeSingle();
  if(error||!data||!data.data)return;
  const d=data.data;
  PAY={intro:typeof d.intro==="string"?d.intro:"",auto:d.auto_show!==false,
    accounts:(Array.isArray(d.accounts)?d.accounts:[]).filter(a=>a&&a.on&&(a.cbu||a.alias))};
  $("pay").hidden=!PAY.accounts.length;
}
function copyBtn(text,v){
  const b=document.createElement("button");b.className="pbtn";b.type="button";b.textContent=text;
  b.onclick=async()=>{
    try{await navigator.clipboard.writeText(v)}catch{
      const t=document.createElement("textarea");t.value=v;document.body.append(t);t.select();
      try{document.execCommand("copy")}catch{}t.remove()}
    b.textContent="Copiado ✓";setTimeout(()=>b.textContent=text,1500);
  };
  return b;
}
function row(label,v){
  const r=document.createElement("div");r.className="r";
  const a=document.createElement("span");a.textContent=label;
  const b=document.createElement("span");b.textContent=v;r.append(a,b);return r;
}
function payBox(intro,accounts){
  const box=document.createElement("div");
  if(intro){const p=document.createElement("div");p.textContent=String(intro);box.append(p)}
  accounts.forEach(a=>{
    const d=document.createElement("div");d.className="pc";
    if(a.label){const b=document.createElement("div");b.className="bk";b.textContent=String(a.label);d.append(b)}
    if(a.cbu)d.append(row("CBU/CVU",String(a.cbu)));
    if(a.alias)d.append(row("Alias",String(a.alias)));
    if(a.holder)d.append(row("Titular",String(a.holder)));
    if(a.note){const n=document.createElement("small");n.className="note";n.textContent=String(a.note);d.append(n)}
    if(a.cbu)d.append(copyBtn("Copiar CBU",String(a.cbu)));
    if(a.alias)d.append(copyBtn("Copiar alias",String(a.alias)));
    box.append(d);
  });
  const up=document.createElement("button");up.type="button";up.className="pbtn go";up.textContent="Subir comprobante";
  up.onclick=()=>$("file").click();box.append(up);
  return box;
}
function showPay(){
  if(!PAY||!PAY.accounts.length)return;
  const old=$("payCard");if(old)old.remove();
  const m=bubble({sender:"agent",kind:"text",created_at:new Date()},payBox(PAY.intro,PAY.accounts));
  m.id="payCard";m.classList.add("card");payShown=true;
}
/* cuentas que te manda el agente por el chat: llegan como mensaje con esta marca */
const MARK="[[CUENTAS]]";
const AUTO="[[RESPUESTA_AUTO]]"; /* nota interna: qué respuesta automática vio el usuario */
const SEEN="[[CUENTAS_VISTAS]]"; /* nota interna: avisa al panel que el usuario vio los datos */
function agentPay(m){
  try{
    const d=JSON.parse(m.body.slice(MARK.length));
    const accts=(Array.isArray(d.a)?d.a:[]).slice(0,6).map(r=>({label:r[0],holder:r[1],cbu:r[2],alias:r[3],note:r[4]}));
    if(!accts.length)return false;
    const b=bubble(m,payBox(d.i,accts));b.classList.add("card");return true;
  }catch{return false}
}
$("pay").onclick=showPay;

/* estado real: "en línea" solo si el agente tiene el panel abierto */
function renderStatus(){
  const t=ONLINE?CFG.status_online:CFG.status_offline;
  $("cstat").textContent=t;$("cstat").hidden=!t;$("chh").classList.toggle("on",ONLINE);
}
/* botones rápidos (CARGAR / RETIRAR / SOPORTE...) */
function renderQuick(){
  const q=$("quick"),list=(CFG.quick||[]).filter(x=>x&&typeof x==="object"&&x.label);
  q.replaceChildren(...list.map((x,i)=>{
    const b=document.createElement("button");b.type="button";b.className="qb"+(i===0?" first":"");
    b.textContent=String(x.label).slice(0,24);b.onclick=()=>quick(x);return b}));
  q.hidden=!list.length;
}
async function quick(x){
  if(!uid)return;
  if(x.text)await sendBody(String(x.text).slice(0,200));
  if(x.action==="pay"&&PAY&&PAY.accounts.length){showPay();await logPay()}
  if(x.action==="reply"&&x.reply){
    const t=String(x.reply).slice(0,600);
    bubble({sender:"agent",kind:"text",body:t,created_at:new Date()},linkEl(t));
    await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind:"text",body:AUTO+JSON.stringify({l:String(x.label||"").slice(0,24),t})});
  }
}
/* texto con enlaces http(s) clickeables (sin innerHTML) */
function linkEl(t){
  const f=document.createDocumentFragment();let last=0;
  for(const m of t.matchAll(/https?:\/\/[^\s<>"]+/g)){
    f.append(t.slice(last,m.index));const u=safe(m[0]);
    if(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener noreferrer";a.textContent=m[0];f.append(a)}else f.append(m[0]);
    last=m.index+m[0].length;
  }
  f.append(t.slice(last));const sp=document.createElement("span");sp.append(f);return sp;
}
/* sonido al recibir un mensaje del agente (solo si el navegador ya lo permite) */
let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch{}}
["pointerdown","keydown","touchstart"].forEach(e=>addEventListener(e,unlockAudio,{passive:true}));
function ding(){
  if(!actx||actx.state!=="running")return;
  try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=988;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.36)}catch{}
}

/* ---------- chat ---------- */
function init(){
  return ready||(ready=(async()=>{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously(); if(r.error){console.error(r.error);alert("El chat no está disponible por ahora.\n\nDetalle técnico: "+r.error.message+(r.error.status?" (código "+r.error.status+")":""));ready=null;return}; session=r.data.session}
    uid=session.user.id;
    if(CFG.chat_notice){const n=document.createElement("div");n.className="sys";n.textContent=CFG.chat_notice;$("msgs").append(n)}
    const {data}=await sb.from("messages").select("*").eq("visitor_id",uid).order("created_at");
    if(!data||!data.length)String(CFG.greeting||"").split(/\n\s*\n/).map(g=>g.trim()).filter(Boolean)
      .forEach(g=>bubble({sender:"agent",kind:"text",body:g,created_at:new Date()}));
    (data||[]).forEach(render);
    await loadPay();
    if(PAY&&PAY.auto&&!(data&&data.length))showPay();
    const pc=sb.channel("agent-presence");
    pc.on("presence",{event:"sync"},()=>{ONLINE=Object.keys(pc.presenceState()).length>0;renderStatus()}).subscribe();
    sb.channel("m-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"visitor_id=eq."+uid},p=>{render(p.new,true)})
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"visitor_id=eq."+uid},p=>change(p.new)).subscribe();
  })());
}
function bubble(m,el){
  const d=document.createElement("div"); d.className="m "+m.sender;
  if(m.id!=null)d.dataset.id=m.id;
  if(el) d.appendChild(el); else{const s=document.createElement("span");s.className="bt";s.textContent=m.body;d.appendChild(s)}
  const t=document.createElement("time"); t.textContent=(m.edited_at?"editado · ":"")+new Date(m.created_at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  d.appendChild(t); $("msgs").appendChild(d); $("msgs").scrollTop=1e9; return d;
}
/* un mensaje que el agente editó o eliminó */
function change(m){
  const d=document.querySelector('#msgs .m[data-id="'+m.id+'"]');if(!d)return;
  if(m.deleted_at){d.remove();return}
  const b=d.querySelector(".bt");
  if(b&&m.kind==="text"){b.textContent=m.body;const t=d.querySelector("time");if(t&&!t.textContent.startsWith("editado"))t.textContent="editado · "+t.textContent}
}
async function render(m,live){
  if(seen.has(m.id))return; seen.add(m.id);
  if(m.deleted_at)return;
  if(m.sender==="visitor"&&m.kind==="text"&&typeof m.body==="string"&&(m.body.startsWith(SEEN)||m.body.startsWith(AUTO)))return;
  if(live&&m.sender==="agent")ding();
  if(m.kind==="text"){if(m.sender==="agent"&&typeof m.body==="string"&&m.body.startsWith(MARK)&&agentPay(m))return;return bubble(m)}
  const {data}=await sb.storage.from("chat-media").createSignedUrl(m.media_path,3600);
  const el=document.createElement(m.kind==="image"?"img":"audio"); el.src=data?data.signedUrl:""; if(m.kind==="audio")el.controls=true;
  bubble(m,el);
}
async function sendBody(body){
  if(!body||!uid)return false;
  const {error}=await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind:"text",body});
  if(error){alert("No se pudo enviar. Probá de nuevo.");return false}
  await logPay();
  return true;
}
/* copia exacta de lo que se le mostró al usuario (mismo formato que las cuentas que manda el agente) */
function snapPay(){
  const acc=(PAY&&PAY.accounts)||[];
  const mk=drop=>SEEN+JSON.stringify({i:(PAY&&PAY.intro)||"",a:acc.slice(0,6).map(a=>[a.label||"",a.holder||"",a.cbu||"",a.alias||"",drop?"":(a.note||"")])});
  let b=mk(false);if(b.length>1900)b=mk(true);if(b.length>1900)b=SEEN;
  return b;
}
/* deja una nota (una sola vez) para que el agente sepa que el usuario ya vio los datos de transferencia */
async function logPay(){
  if(!payShown||payLogged||!uid)return;
  payLogged=true;
  const {error}=await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind:"text",body:snapPay()});
  if(error)payLogged=false;
}
async function sendText(){
  const body=$("txt").value.trim(); if(!body||!uid)return; $("txt").value="";
  if(!await sendBody(body))$("txt").value=body;
}
async function upload(blob,kind,mime){
  const path=`${uid}/${Date.now()}.${mime.split("/")[1]}`;
  const {error}=await sb.storage.from("chat-media").upload(path,blob,{contentType:mime});
  if(error)return alert("No se pudo enviar el archivo.");
  await sb.from("messages").insert({visitor_id:uid,sender:"visitor",kind,media_path:path});
  await logPay();
}
$("open").onclick=async()=>{$("chat").hidden=false;syncFab();if(PREVIEW){previewChat();return}await init();$("txt").focus()};
$("close").onclick=()=>{$("chat").hidden=true;syncFab()};
$("send").onclick=sendText;
$("txt").onkeydown=e=>{if(e.key==="Enter")sendText()};
$("file").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||!uid)return;
  if(f.size>5*1024*1024)return alert("La imagen supera los 5 MB.");
  await upload(f,"image",f.type);
};
let rec,chunks,timer;
$("mic").onclick=async()=>{
  if(!uid)return;
  if(rec&&rec.state==="recording"){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";
    rec=new MediaRecorder(s,{mimeType:mime}); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{clearTimeout(timer);s.getTracks().forEach(t=>t.stop());$("mic").classList.remove("rec");
      const b=new Blob(chunks,{type:mime}); if(b.size>1000) await upload(b,"audio",mime)};
    rec.start(); $("mic").classList.add("rec"); timer=setTimeout(()=>rec.stop(),120000);
  }catch{alert("Permití el acceso al micrófono para enviar audios.")}
};
</script>
