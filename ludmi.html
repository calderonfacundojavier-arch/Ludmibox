<style>
:root{--bg:#0b0414;--pink:#d41cd8;--gold:#ffd21f;--card:rgba(20,6,34,.75)}

body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 50% -10%,#6a0f8f,transparent 60%),radial-gradient(700px 500px at 100% 100%,#8a1050,transparent 55%),var(--bg)}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}

.avatar{width:84px;height:84px;border-radius:50%;border:3px solid var(--pink);margin:0 auto 6px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#ffb800,#a0198a);box-shadow:0 0 24px #d41cd8aa;overflow:hidden}

.bonus{border:1px solid var(--pink);border-radius:18px;background:var(--card);padding:16px 10px;margin-bottom:14px;box-shadow:0 0 22px #d41cd855}

.cta{width:100%;border:0;border-radius:40px;padding:17px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(#22c55e,#15803d);cursor:pointer;text-transform:uppercase;box-shadow:0 0 20px #22c55e66}
.cta:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{margin:12px 0;padding:10px 14px;border:1px solid #14b86a66;border-radius:12px;font-size:12px;color:#34f5a0;background:var(--card)}
.contacts{display:grid;gap:8px;margin:12px 0}
.cbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid var(--pink);border-radius:30px;color:#fff;text-decoration:none;font:inherit;font-weight:800;font-size:14px;background:var(--card);cursor:pointer}
.cbtn svg{width:22px;height:22px;flex:none}
.cbtn img{width:24px;height:24px;object-fit:contain;border-radius:6px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid div{border:1px solid var(--pink);border-radius:12px;padding:12px 6px;background:var(--card);font-size:12px;font-weight:800}
.grid span{display:block;font-weight:400;color:#c9c0d2;margin-top:4px;font-size:11px}
.wheel{margin:20px 0;padding:20px 14px 16px;border-radius:22px;background:linear-gradient(170deg,rgba(212,28,216,.22),rgba(255,210,31,.08)),var(--glass,rgba(255,255,255,.07));box-shadow:0 12px 40px #0008,inset 0 0 0 1px var(--edge,#fff3)}
.wheel h2{margin:0 0 4px;font-size:18px;letter-spacing:0;text-transform:none}
.wheel p{margin:0 0 14px;font-size:13px;color:#e9d9f4}
.wbox{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:6px auto 16px}
.wbox canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px #ffd21f,0 0 0 9px #0006,0 10px 34px #000a,0 0 40px #d41cd88a}
.wptr{position:absolute;left:50%;top:-14px;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 3px 3px #000a);z-index:2}
#wov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(6,1,14,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto}
.wmodal{position:relative;width:min(380px,100%);animation:rise .45s both}
.wmodal .wheel{margin:0}
#wx{position:absolute;right:8px;top:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:16px;cursor:pointer}
.wheel .cta:disabled{opacity:.6;cursor:default}
#wres{margin:14px 0 4px;padding:12px;border-radius:14px;background:#ffd21f22;box-shadow:inset 0 0 0 1px #ffd21f66;font-weight:800;font-size:18px;color:#ffe066}
#wodds{display:block;margin-top:10px;font-size:11px;color:var(--mut,#b9aec9);line-height:1.5}
.sec{margin:18px 0}
.sec h2{font-size:12px;letter-spacing:.18em;margin:0 0 8px;text-transform:uppercase}
.faq{text-align:left}.faq h2{text-align:center}
.faq details{border:1px solid var(--pink);border-radius:12px;background:var(--card);margin:8px 0;overflow:hidden}
.faq summary{cursor:pointer;padding:13px 14px;font-weight:800;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1;flex:none}
.faq details[open] summary::after{content:"\2013"}
.faq summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.faq .ans{padding:0 14px 14px;font-size:13px;line-height:1.55;color:#e3dcec;white-space:pre-line;overflow-wrap:anywhere}
.row{display:flex;gap:12px;overflow-x:auto;padding:12px;border:1px solid var(--pink);border-radius:14px;background:var(--card);scrollbar-width:thin;scrollbar-color:var(--pink) transparent}
.row::-webkit-scrollbar{height:6px}
.row::-webkit-scrollbar-track{background:transparent}
.row::-webkit-scrollbar-thumb{background:var(--pink);border-radius:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;display:flex;align-items:center;gap:8px;border:0;border-radius:30px;padding:14px 18px;background:linear-gradient(#22c55e,#15803d);color:#fff;font:inherit;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 6px 24px #000a,0 0 18px #22c55e88}
.fab img{width:24px;height:24px;object-fit:contain;display:block}
.fab span:empty{display:none}
.item{flex:none;width:84px;font-size:11px;font-weight:800;overflow-wrap:anywhere;color:inherit;text-decoration:none;display:block}
a.item:hover img{filter:brightness(1.15)}
.item img{width:72px;height:72px;object-fit:cover;display:block;margin:0 auto 6px;border:2px solid var(--pink);border-radius:14px;background:#150626}
.row.round .item img{border-radius:50%}
footer{font-size:11px;color:#b8aec4;margin-top:26px;line-height:1.6}
/* ===== tema moderno (landing) ===== */
:root{--bg:#09030f;--pink:#d41cd8;--gold:#ffd21f;--card:rgba(255,255,255,.06);--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--mut:#b9aec9}
body{background:radial-gradient(900px 520px at 50% -12%,#6a0f8f 0,transparent 62%),radial-gradient(600px 460px at 105% 55%,#7a0f55 0,transparent 60%),radial-gradient(500px 400px at -10% 90%,#2a1470 0,transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;padding:36px 18px 110px}
.avatar{width:96px;height:96px;border:0;margin:0 auto 10px;position:relative;isolation:isolate;overflow:visible;box-shadow:0 10px 34px #d41cd877;background:linear-gradient(135deg,#ffb800,#a0198a)}

@keyframes spin{to{transform:rotate(360deg)}}
.name{color:#f0a6f2;font-size:11px;letter-spacing:.34em;font-weight:700;opacity:.95}
h1{font-size:clamp(28px,8.5vw,38px);letter-spacing:-.01em;margin:10px 0 18px;line-height:1.02;background:linear-gradient(180deg,#fff 30%,#e9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bonus{position:relative;border:0;border-radius:22px;padding:20px 12px 18px;margin-bottom:16px;background:linear-gradient(160deg,rgba(212,28,216,.28),rgba(255,210,31,.10)),var(--glass);box-shadow:0 12px 40px #0008,inset 0 0 0 1px var(--edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden}
.bonus::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(#ffd21f55,transparent 65%);pointer-events:none}
.bonus small{font-size:12px;font-weight:600;letter-spacing:.06em;color:#f3e3fa}
.bonus b{font-size:clamp(34px,11vw,48px);margin:8px 0;text-shadow:0 4px 24px #ffd21f55}
.cta{padding:18px;font-size:16px;letter-spacing:.04em;box-shadow:0 10px 28px #22c55e55,inset 0 1px 0 #ffffff55;background:linear-gradient(180deg,#34d570,#16a34a);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80px}100%{left:120%}}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px #22c55e77,inset 0 1px 0 #ffffff55}
.cta:active{transform:scale(.98)}
.status{margin:12px 0 4px;padding:9px 14px;border:0;border-radius:14px;font-size:12.5px;color:#7dffc4;background:rgba(20,184,106,.12);box-shadow:inset 0 0 0 1px #14b86a44}
.sec{margin:26px 0}
.sec h2{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.2em;color:#e9c8ff;margin:0 0 12px}
.sec h2::before,.sec h2::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ffffff33)}
.sec h2::after{transform:scaleX(-1)}
.row{border:0;border-radius:20px;padding:14px;gap:14px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);scroll-snap-type:x proximity}
.item{width:88px;scroll-snap-align:start;font-weight:700;font-size:11.5px;transition:transform .18s}
a.item:hover{transform:translateY(-3px)}
.item img{width:76px;height:76px;border:0;border-radius:20px;box-shadow:0 6px 18px #0009,inset 0 0 0 1px #ffffff22;margin-bottom:8px}
.row.round .item img{border-radius:50%}
.grid{gap:10px;margin:18px 0}
.grid div{border:0;border-radius:16px;padding:14px 6px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);font-size:12.5px}
.grid span{color:var(--mut)}
.faq details{border:0;border-radius:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);margin:10px 0;transition:background .2s}
.faq details[open]{background:rgba(255,255,255,.10)}
.faq summary{padding:15px 16px;font-size:14.5px}
.faq summary::after{content:"+";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ffd21f22;font-size:18px}
.faq .ans{padding:0 16px 16px;color:#ece4f4;font-size:13.5px}
.contacts{gap:10px;margin:22px 0 6px}
.cbtn{justify-content:flex-start;padding:13px 16px;border:0;border-radius:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);transition:transform .15s,background .15s}
.cbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.cbtn::after{content:"\203A";margin-left:auto;font-size:22px;line-height:1;opacity:.5}
.cbtn svg{width:24px;height:24px}
footer{color:var(--mut);margin-top:34px;opacity:.8}
.fab{padding:15px 20px;background:linear-gradient(180deg,#34d570,#16a34a);box-shadow:0 10px 30px #000a,0 0 0 4px #22c55e33;transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:no-preference){.wrap>*,#blocks>*{animation:rise .6s both}#blocks>*:nth-child(2){animation-delay:.07s}#blocks>*:nth-child(3){animation-delay:.14s}#blocks>*:nth-child(4){animation-delay:.21s}#blocks>*:nth-child(n+5){animation-delay:.28s}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.avatar::before,.cta::after{animation:none}}
/* chat (tema claro por defecto, oscuro opcional) */
#chat{--bg:#e9edef;--hd:#1f2a30;--hdt:#fff;--hds:#8fe3b0;--ag:#fff;--agt:#111b21;--me:#d9fdd3;--met:#111b21;--mut:#667781;--bar:#f0f2f5;--inp:#fff;--inpt:#111b21;--ic:#54656f;--line:#d1d7db;--acc:#25d366;--sys:#cfe9f7;--syst:#34546a;--card:#f7f8f8;--chip:#fff}
#chat.dark{--bg:#150626;--hd:#2a0a45;--hdt:#fff;--hds:#34f5a0;--ag:#3a1260;--agt:#fff;--me:#16803d;--met:#fff;--mut:#ffffff99;--bar:#2a0a45;--inp:#150626;--inpt:#fff;--ic:#fff;--line:#4a1d6e;--acc:#22c55e;--sys:#2a0a45;--syst:#d9c6ee;--card:#0006;--chip:#3a1260}
#chat{position:fixed;right:16px;bottom:16px;width:360px;height:560px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--bg);color:var(--agt);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px #000a;z-index:9}
@media(max-width:520px){#chat{inset:0;width:auto;height:auto;max-height:none;border-radius:0;border:0}}
.chh{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--hd);color:var(--hdt)}
.cav{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:20px;background:#444;flex:none;border:2px solid var(--acc)}
.cav img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0;line-height:1.25}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.75}
.who small::before{content:"";width:8px;height:8px;border-radius:50%;background:#8696a0;flex:none}
.chh.on .who small{opacity:1;color:var(--hds)}
.chh.on .who small::before{background:var(--acc)}
.chh button{background:none;border:0;color:var(--hdt);font-size:20px;cursor:pointer;padding:6px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.sys{align-self:center;background:var(--sys);color:var(--syst);font-size:12px;padding:6px 12px;border-radius:8px;text-align:center;margin:2px 0 6px}
.m{max-width:82%;padding:8px 10px 6px;border-radius:10px;font-size:14px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;text-align:left;box-shadow:0 1px .5px #0002}
.m.visitor{align-self:flex-end;background:var(--me);color:var(--met)}
.m.agent{align-self:flex-start;background:var(--ag);color:var(--agt)}
.m img{max-width:100%;border-radius:8px;display:block}.m audio{max-width:100%}
.m time{display:block;text-align:right;font-size:10px;color:var(--mut);margin-top:3px}
.m.card{max-width:96%;align-self:stretch}
#nameBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
#nameBar label{flex:1 0 100%;font-size:12px;font-weight:700;color:var(--agt)}
#nameBar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;background:var(--inp);color:var(--inpt)}
#nameBar button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;font-size:13px;background:var(--acc);color:#fff;cursor:pointer}
#nameBar button:disabled{opacity:.6}
#nameBar small{flex:1 0 100%;color:var(--mut);font-size:11px;min-height:0}
#nameBar #nameErr{color:#dc2626;font-weight:700}
#chat.needname #msgs,#chat.needname #quick,#chat.needname #bar{display:none}
#chat.needname #nameBar{flex:1;align-content:center;justify-content:center;padding:26px 20px;border:0;background:var(--bg)}
#chat.needname #nameBar label{font-size:18px;text-align:center}
#chat.needname #nameBar small{text-align:center}
.m a{color:inherit;text-decoration:underline;word-break:break-all}
.m time em{font-style:normal}
.tk{margin-left:4px;font-size:11px;letter-spacing:-2px;color:var(--mut)}.tk.rd{color:#53bdeb}
.pc{margin-top:8px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.pc .bk{font-weight:800;margin-bottom:6px}
.pc .r{display:flex;gap:8px;font-size:13px;margin:3px 0}
.pc .r span:first-child{color:var(--mut);min-width:62px;flex:none}
.pc .r span:last-child{font-weight:700;overflow-wrap:anywhere}
.pc .note{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.pbtn{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--chip);color:var(--agt);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.pbtn.go{background:var(--acc);border-color:var(--acc);color:#fff;text-transform:uppercase}
#quick{display:flex;gap:8px;padding:8px 10px;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto}
.qb{flex:1 0 auto;padding:10px 14px;border-radius:8px;border:2px solid var(--line);background:var(--chip);color:var(--agt);font:inherit;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;text-transform:uppercase}
.qb.first{background:var(--acc);border-color:var(--acc);color:#fff}
#bar{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bar);align-items:center}
#bar input[type=text]{flex:1;min-width:0;border:0;border-radius:22px;padding:11px 14px;font-size:16px;background:var(--inp);color:var(--inpt)}
.ic{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ic);font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
#send{background:var(--acc);color:#fff}
.ic img,#pay img{width:22px;height:22px;object-fit:contain;display:block}
.ic.rec{background:#dc2626;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.ic.rec{animation:none}}
#pwaWrap{text-align:center;margin:18px 0 4px}
#pwaBtn{border:1px solid #ffffff55;background:#ffffff1f;color:#fff;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px)}
#pwaBtn:hover{background:#ffffff33}
#pwaHint{margin:10px auto 0;max-width:320px;font-size:13px;line-height:1.45;color:#fffc}
.pcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pcar::-webkit-scrollbar{display:none}
.pcd{flex:0 0 84%;scroll-snap-align:center;border:1px solid var(--pink);border-radius:18px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.pcar.one .pcd{flex-basis:100%}
.pcd img{width:100%;height:auto;display:block;background:#150626}
.pcd .pb{padding:12px;display:grid;gap:10px}
.pcd .pb b{font-size:15px;line-height:1.3}
.pbtn{border:0;border-radius:12px;padding:12px;font:inherit;font-size:14px;font-weight:800;color:#fff;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(180deg,#34d570,#16a34a);box-shadow:0 6px 16px #22c55e44}
#wskip{background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;margin-top:12px;cursor:pointer;font:inherit;font-size:13px}
</style></head>
<body>
<div id="bg" hidden></div>
<main class="wrap">
  <div class="avatar" id="av" aria-hidden="true">👑</div>
  <div class="name" id="nm"></div>
  <h1 id="ttl"></h1>
  <div id="blocks">
    <div id="b-bonus"><div class="bonus"><small id="b1"></small><b id="b2"></b><small id="b3"></small></div></div>
    <div id="b-cta"><button class="cta" id="open"></button><div class="status" id="st"></div></div>
    <div id="b-wheel"><section class="wheel" id="wheel" hidden aria-label="Ruleta de bonos">
      <h2 id="wheelT"></h2><p id="wheelS"></p>
      <div class="wbox"><div class="wptr" aria-hidden="true"></div><canvas id="wcv" width="600" height="600" aria-hidden="true"></canvas></div>
      <button class="cta" id="wbtn" type="button"></button>
      <div id="wres" role="status" aria-live="polite" hidden></div>
      <small id="wodds"></small>
      <button id="wskip" type="button" hidden></button>

function wPrizes(){
  const l=Array.isArray(CFG.wheel_prizes)?CFG.wheel_prizes:[];
  const p=l.filter(x=>x&&typeof x==="object"&&typeof x.label==="string"&&x.label.trim()).slice(0,10)
    .map(x=>({label:x.label.trim().slice(0,24),w:Math.min(1000,Math.max(0,Number(x.w)||0))}));
  return p.length>=2?p:null;
}
function wDraw(){
  const P=wPrizes(),cv=$("wcv");if(!P||!cv)return;
  const c=cv.getContext("2d"),S=cv.width,R=S/2,n=P.length,seg=Math.PI*2/n;
  c.clearRect(0,0,S,S);c.save();c.translate(R,R);
  for(let i=0;i<n;i++){
    const a0=W.a+i*seg;
    c.beginPath();c.moveTo(0,0);c.arc(0,0,R-4,a0,a0+seg);c.closePath();
    c.fillStyle=WCOL[i%WCOL.length];c.fill();c.lineWidth=3;c.strokeStyle="#ffffffaa";c.stroke();
    c.save();c.rotate(a0+seg/2);c.textAlign="right";c.fillStyle="#fff";c.shadowColor="#0008";c.shadowBlur=4;
    c.font="800 "+(n>7?26:32)+"px system-ui,sans-serif";c.fillText(P[i].label,R-30,11);c.restore();
  }
  c.beginPath();c.arc(0,0,44,0,7);c.fillStyle="#ffd21f";c.fill();c.lineWidth=6;c.strokeStyle="#fff";c.stroke();
  c.fillStyle="#7a1a8a";c.font="900 30px system-ui,sans-serif";c.textAlign="center";c.fillText("★",0,11);
  c.restore();
}
/* sorteo con probabilidades distintas: la que tiene más "peso" sale más seguido */
function wPick(P){
  const tot=P.reduce((s,x)=>s+x.w,0);
  if(!tot)return Math.floor(Math.random()*P.length);
  let r=Math.random()*tot;
  for(let i=0;i<P.length;i++){r-=P[i].w;if(r<0)return i}
  return P.length-1;
}

function wTick(ts){
  const dt=Math.min(.05,(ts-W.last)/1000||0);W.last=ts;
  if(W.state==="spinning"){
    W.v=Math.min(W.max,W.v+W.max*dt/.5);W.a+=W.v*dt;
    if(ts-W.t0>15000)wStop();
  }else if(W.state==="stopping"){
    const k=Math.min(1,(ts-W.s0)/W.T),e=1-(1-k)*(1-k);
    W.a=W.a0+W.D*e;
    if(k>=1){W.state="done";wDraw();wFinish();return}
  }
  wDraw();
  if(W.state==="spinning"||W.state==="stopping")W.raf=requestAnimationFrame(wTick);
}
function wSpin(){
  if(!wPrizes())return;
  W.state="spinning";W.v=0;W.t0=performance.now();W.last=W.t0;$("wres").hidden=true;wBtn();
  $("wbtn").disabled=true;setTimeout(()=>{if(W.state==="spinning")$("wbtn").disabled=false},500);
  cancelAnimationFrame(W.raf);W.raf=requestAnimationFrame(wTick);
}
function wStop(){
  const P=wPrizes();if(!P||W.state!=="spinning")return;
  const n=P.length,seg=Math.PI*2/n,idx=wPick(P),off=(Math.random()-.5)*.7;
  const target=Math.PI*1.5-(idx+.5+off)*seg;
  const D=((((target-W.a)%(Math.PI*2))+Math.PI*2)%(Math.PI*2))+Math.PI*4;
  W.idx=idx;W.a0=W.a;W.D=D;W.s0=performance.now();
  W.T=Math.min(5200,Math.max(2600,2*D/Math.max(W.v,4)*1000));
  W.state="stopping";wBtn();
}
function wFinish(){
  const P=wPrizes(),label=P?P[W.idx].label:"";
  $("wres").hidden=false;$("wres").textContent="🎉 ¡Ganaste "+label+"!";
  if(PREVIEW){setTimeout(()=>{W.state="idle";$("wres").hidden=true;wBtn()},2500);wBtn();return}
  if(CFG.wheel_once)LSG.set("wheel_done",label);

  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";
    rec=new MediaRecorder(s,{mimeType:mime}); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{clearTimeout(timer);s.getTracks().forEach(t=>t.stop());$("mic").classList.remove("rec");
      const b=new Blob(chunks,{type:mime}); if(b.size>1000) await upload(b,"audio",mime)};
    rec.start(); $("mic").classList.add("rec"); timer=setTimeout(()=>rec.stop(),120000);
  }catch{alert("Permití el acceso al micrófono para enviar audios.")}
};
</script>
</body></html>
