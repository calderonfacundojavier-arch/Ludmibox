<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1210">
<title>Gestión · Caja Ludmi</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("g_theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{--bg:#0b1210;--p:#121c19;--p2:#182521;--b:#243630;--b2:var(--b2);--t:#e8f3ee;--m:#8aa79b;--a:#00e676;--a2:#00b85a;--r:#ff5252;--y:#ffca28;--bl:#4dabf7;--on:#032;color-scheme:dark}
:root[data-theme=light]{--bg:#eef3f1;--p:#ffffff;--p2:#e6eeea;--b:#cfdcd6;--b2:#e3ece8;--t:#13211b;--m:#586f65;--a:#00a152;--a2:#007c3e;--r:#d32f2f;--y:#a87400;--bl:#1971c2;--on:#fff;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login,#shift{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px}
.box{width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--m);font-size:13px;margin:0 0 14px}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:9px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
.btn{background:var(--a);color:var(--on);border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}.btn.s{padding:6px 10px;font-size:13px}
.btn.g{background:var(--p2);color:var(--t);border:1px solid var(--b)}.btn.d{background:var(--r);color:#fff}
.full{width:100%;margin-top:14px}
.err{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}
.lnk{background:none;border:0;color:var(--a);cursor:pointer;padding:6px 0;font-size:13px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--b);color:var(--m)}
.badge.adm{color:var(--y);border-color:var(--y)}
#app{display:flex;min-height:100vh}
#side{flex:0 0 232px;width:232px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--p);border-right:1px solid var(--b);padding:14px 10px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px;border-bottom:1px solid var(--b)}
.brand img{width:46px;height:46px;border-radius:50%;border:2px solid var(--a);object-fit:cover}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--m);font-size:12px}
nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding:10px 0}
nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:var(--m);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;width:100%}
nav button::before{content:attr(data-ic);width:22px;text-align:center;font-size:16px}
nav button:hover{background:var(--p2)}
nav button.on{background:var(--p2);color:var(--a);box-shadow:inset 3px 0 0 var(--a)}
.sfoot{border-top:1px solid var(--b);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.sfoot .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.sfoot .btn{width:100%}
#topbar{display:none}#scrim{display:none}
#sideShow{display:none}
@media(min-width:821px){#app.side-off #side{display:none}#app.side-off #sideShow{display:block;position:fixed;left:12px;top:12px;z-index:45}#app.side-off main{padding-top:58px}}
main{padding:16px;max-width:1100px;margin:0 auto;flex:1;min-width:0;width:100%}
html[data-theme=light] input,html[data-theme=light] select,html[data-theme=light] textarea{background:#fff}
.lg{width:92px;height:92px;border-radius:50%;border:3px solid var(--a);display:block;margin:0 auto 10px;object-fit:cover}
.thf{position:fixed;top:10px;right:10px;z-index:60;width:auto!important}
@media(max-width:820px){
  #app{display:block}
  #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--p);border-bottom:1px solid var(--b);padding:8px 12px}
  #topbar img{width:34px;height:34px;border-radius:50%;border:2px solid var(--a)}#topbar b{flex:1}
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 24px #0008}

}

.kpi .v{font-size:22px;font-weight:800}.kpi .l{font-size:12px;color:var(--m)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}.row>*{flex:1;min-width:110px}.row>.btn{flex:0 0 auto;align-self:flex-end}.mfB .row{flex-wrap:nowrap;align-items:center}.mfB .row select{flex:0 0 74px;min-width:0}.mfB .row input{min-width:0}

.tw{overflow-x:auto}
.pos{color:var(--a)}.neg{color:var(--r)}.mut{color:var(--m)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--p2);border:1px solid var(--b)}
.wc{border-left:5px solid var(--a)}
.wc .bal{font-size:24px;font-weight:800;margin:4px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:8px;background:var(--p2);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--a)}

.nb{background:var(--r);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:5px}
.prev{background:var(--p2);border-radius:9px;padding:9px 11px;margin-top:10px;font-size:13px}
</style></head><body>

<div id="login" class="hide"><div class="card box">

  <div id="sPick"><label>Cajero</label><select id="sSel"></select>
    <label>Contraseña</label><input id="sPin" type="password" autocomplete="off">

    <label>Contraseña (mín. 4)</label><input id="cPin" type="password" autocomplete="new-password">
    <label>Repetir contraseña</label><input id="cPin2" type="password" autocomplete="new-password">
    <div class="err" id="cErr"></div>
    <button class="btn full" id="cGo">Crear y empezar turno</button>
    <button class="lnk" id="cBack">← Volver</button></div>
  <button class="lnk" id="sOut" style="margin-top:8px">Salir de la cuenta</button>
</div></div>

<div id="app" class="hide">
  <div id="topbar"><button class="btn g s" id="burger" aria-label="Menú">☰</button><img src="/icon-192.png" alt=""><b>Caja Ludmi</b><button class="btn g s thb" data-th></button></div>
  <aside id="side">
    <div class="brand"><img src="/icon-192.png" alt="Caja Ludmi"><div style="flex:1"><b>Caja Ludmi</b><small>Sistema de gestión</small></div><button class="btn g s" id="sideHide" title="Ocultar menú" aria-label="Ocultar menú">«</button></div>

      <button class="btn g s thb" data-th></button><button class="btn g s hide" id="hChat" title="Abrir el chat en otra pestaña">💬 Chat</button><button class="btn g s hide" id="hShift">Cambiar turno</button><button class="btn g s" id="hOut">Salir</button></div>
  </aside>
  <div id="scrim"></div>
  <button class="btn g s" id="sideShow" title="Mostrar menú">☰ Menú</button>
  <main id="view"></main>
</div>
<button class="btn g s thb thf" data-th id="thF"></button>
<div id="toast" class="hide"></div>
<div id="ovs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://otlrgjezfuwlxqigqpfz.supabase.co", SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bHJnamV6ZnV3bHhxaWdxcGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjY5MDEsImV4cCI6MjEwNjU0MjkwMX0.j_eQn8LafoxQ8WeT4OlBrfFTDvZIV8tO4pGylbGKu7k";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:"gestion-auth"}});
const S={role:null,shift:null,cfg:{op_can_edit:false,op_history_days:2},wallets:[],chips:[],ads:[],cajeros:[],tab:"dash"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=v=>Number(v)||0;
const fm=n=>"$"+N(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:2});
const fn=n=>N(n).toLocaleString("es-AR",{maximumFractionDigits:2});
const TZ="America/Argentina/Buenos_Aires";
const fdt=t=>t?new Date(t).toLocaleString("es-AR",{timeZone:TZ,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const fdt2=t=>t?new Date(t).toLocaleString("es-AR",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:TZ});
const dayISO=d=>new Date(d+"T00:00:00-03:00").toISOString();
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const isAdm=()=>S.role==="admin";
const sid=()=>S.shift?S.shift.id:null;
let tt;function toast(m,bad){const t=$("toast");t.textContent=m;t.className=bad?"bad":"";clearTimeout(tt);tt=setTimeout(()=>t.className="hide",bad?5000:2600)}
async function q(p){const r=await p;if(r.error)throw new Error(r.error.message||String(r.error));return r.data}
const rpc=(n,a)=>q(sb.rpc(n,a||{}));
async function run(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message||"Error",true)}finally{if(btn)btn.disabled=false}}
function modal(html,wide){const d=document.createElement("div");d.className="ov";d.innerHTML='<div class="card'+(wide?" wide":"")+'">'+html+"</div>";
  d.addEventListener("mousedown",e=>{if(e.target===d)d.remove()});$("ovs").appendChild(d);return d}
const opts=(arr,sel,f)=>arr.map(x=>`<option value="${esc(x.id)}"${x.id===sel?" selected":""}>${esc(f?f(x):x.name)}</option>`).join("");
const KIND={carga:"Carga",retiro:"Retiro","ajuste+":"Ajuste +","ajuste-":"Ajuste −",gasto:"Gasto",sueldo:"Sueldo",transf_in:"Transf. recibida",transf_out:"Transf. enviada",rend:"Rendimiento",inicial:"Saldo inicial",compra:"Compra"};

/* ---------- sesión ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){show("login");return}
  await init();
}
function show(w){["login","shift","app"].forEach(x=>$(x).classList.toggle("hide",x!==w));$("thF").classList.toggle("hide",w==="app")}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("g_theme",t)}catch(e){}
  document.querySelectorAll("[data-th]").forEach(b=>b.textContent=t==="dark"?"☀️ Modo día":"🌙 Modo noche");
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="dark"?"#0b1210":"#eef3f1"}
document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
setTheme(document.documentElement.dataset.theme||"dark");
const setSide=off=>{$("app").classList.toggle("side-off",off);try{localStorage.setItem("g_side",off?"off":"on")}catch(e){}};
try{if(localStorage.getItem("g_side")==="off")setSide(true)}catch(e){}
$("sideHide").onclick=()=>setSide(true);$("sideShow").onclick=()=>setSide(false);
const sideClose=()=>{$("side").classList.remove("open");$("scrim").classList.remove("on")};
$("burger").onclick=()=>{$("side").classList.toggle("open");$("scrim").classList.toggle("on")};$("scrim").onclick=sideClose;
const ICONS={dash:"📊",bill:"👛",fich:"🎰",mov:"🔎",usr:"🏆",rep:"📋",bon:"🎁",caj:"👥",pub:"📣",gas:"🧾",met:"📈",cfg:"⚙️"};
$("lf").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";const b=$("lb");b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});
  b.disabled=false;if(error){$("lerr").textContent="Usuario o contraseña incorrectos.";return}
  $("lp").value="";await init()};
async function logout(){clearInterval(repT);try{if(S.shift)await sb.rpc("g_end_shift",{p_shift:S.shift.id})}catch(e){}
  S.shift=null;try{sessionStorage.removeItem("g_shift")}catch(e){}await sb.auth.signOut();S.role=null;show("login")}
$("hOut").onclick=logout;$("sOut").onclick=logout;
async function init(){
  let who;try{who=await rpc("g_whoami")}catch(e){who=null}
  if(!who||!who.role){await sb.auth.signOut();show("login");$("lerr").textContent="Este usuario no tiene acceso a Gestión.";return}
  S.role=who.role;S.cfg={op_can_edit:!!who.op_can_edit,op_history_days:who.op_history_days||2};
  if(!isAdm()){
    let sh=null;try{sh=JSON.parse(sessionStorage.getItem("g_shift")||"null")}catch(e){}
    if(sh&&sh.id){S.shift=sh}else{await showShift();return}
  }
  await enterApp();
}
async function showShift(){
  show("shift");$("sPick").classList.remove("hide");$("sCreate").classList.add("hide");$("sErr").textContent="";$("sPin").value="";
  try{const l=await rpc("g_cajero_choices");$("sSel").innerHTML=l.length?opts(l):'<option value="">(no hay cajeros: creá tu usuario)</option>'}catch(e){$("sErr").textContent=e.message}
}
$("sNew").onclick=()=>{$("sPick").classList.add("hide");$("sCreate").classList.remove("hide");$("cErr").textContent=""};
$("cBack").onclick=()=>{$("sCreate").classList.add("hide");$("sPick").classList.remove("hide")};
async function startShift(id,pin,errEl,btn){
  btn.disabled=true;
  try{const r=await rpc("g_start_shift",{p_cajero:id,p_pin:pin});
    if(!r.ok){errEl.textContent=r.error;return false}
    S.shift={id:r.shift_id,name:r.name};try{sessionStorage.setItem("g_shift",JSON.stringify(S.shift))}catch(e){}
    await enterApp();return true}
  catch(e){errEl.textContent=e.message;return false}finally{btn.disabled=false}
}
$("sGo").onclick=()=>{$("sErr").textContent="";if(!$("sSel").value){$("sErr").textContent="Elegí tu nombre.";return}startShift($("sSel").value,$("sPin").value,$("sErr"),$("sGo"))};
$("sPin").onkeydown=e=>{if(e.key==="Enter")$("sGo").click()};
$("cGo").onclick=async()=>{const e=$("cErr");e.textContent="";const n=$("cName").value.trim(),p=$("cPin").value;
  if(n.length<2){e.textContent="Escribí tu nombre o apodo.";return}
  if(p.length<4){e.textContent="La contraseña debe tener al menos 4 caracteres.";return}
  if(p!==$("cPin2").value){e.textContent="Las contraseñas no coinciden.";return}
  $("cGo").disabled=true;
  try{const id=await rpc("g_register_cajero",{p_name:n,p_pin:p});
    $("cName").value=$("cPin").value=$("cPin2").value="";
    await startShift(id,p,e,$("cGo"))}catch(x){e.textContent=x.message}finally{$("cGo").disabled=false}};
$("hShift").onclick=async()=>{try{if(S.shift)await sb.rpc("g_end_shift",{p_shift:S.shift.id})}catch(e){}
  S.shift=null;try{sessionStorage.removeItem("g_shift")}catch(e){}await showShift()};

/* ---------- app ---------- */
const TABS_OP=[["dash","Dashboard"],["bill","Billeteras"],["fich","Fichas"],["mov","Movimientos"],["usr","Usuarios"],["gas","Gastos"],["pub","Publicidad"],["bon","Bonos"]];
const TABS_AD=[["dash","Dashboard"],["bill","Billeteras"],["fich","Fichas"],["mov","Movimientos"],["usr","Usuarios"],["rep","Reportes"],["caj","Cajeros"],["pub","Publicidad"],["bon","Bonos"],["gas","Gastos"],["met","Métricas"],["cfg","Ajustes"]];
async function enterApp(){
  show("app");$("hRole").textContent=isAdm()?"ADMIN":"OPERADOR";$("hRole").className="badge"+(isAdm()?" adm":"");
  $("hCaj").textContent=isAdm()?"":"Turno: "+S.shift.name;$("hShift").classList.toggle("hide",isAdm());
  const T=isAdm()?TABS_AD:TABS_OP;$("nav").innerHTML=T.map(t=>`<button data-t="${t[0]}" data-ic="${ICONS[t[0]]||"•"}">${t[1]}</button>`).join("");
  $("hChat").onclick=()=>{try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}window.open("/admin","ludmi-chat")};
  $("nav").onclick=e=>{const b=e.target.closest("button");if(b){sideClose();go(b.dataset.t)}};
  if(isAdm())startRepPoll();
  startChatPoll();
  await go("dash");
}
let repT=null,repLast=-1,chT=null,chLast=-1,chTs=-1,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.5);o.start();o.stop(actx.currentTime+.5);
  const o2=actx.createOscillator(),g2=actx.createGain();o2.frequency.value=1175;o2.connect(g2);g2.connect(actx.destination);g2.gain.setValueAtTime(.0001,actx.currentTime+.25);g2.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.27);g2.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.8);o2.start(actx.currentTime+.25);o2.stop(actx.currentTime+.8)}catch(e){}}
document.addEventListener("click",()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}},{once:true});
function startChatPoll(){clearInterval(chT);chLast=-1;chTs=-1;chCheck();chT=setInterval(chCheck,5000)}
async function chCheck(){
  if($("app").classList.contains("hide"))return;
  try{const r=await rpc("g_chat_unread"),n=+r.msgs||0,c=+r.chats||0,b=$("hChat");
    b.classList.toggle("hide",false);b.innerHTML="💬 Chat"+(n>0?`<span class="nb">${n}</span>`:"");b.classList.toggle("alert",n>0);
    document.title=(n>0?"("+n+") 💬 ":"")+"Gestión · Caja Ludmi";
    const ts=r.last?Date.parse(r.last)||0:0;
    if(chTs>=0&&ts>chTs){beep();toast("💬 Mensaje nuevo en el chat");

function movWire(root){

  root.addEventListener("input",upd);root.addEventListener("change",upd);if(root.id==="dForm")g("mfW").addEventListener("change",()=>setLastW(g("mfW").value));upd();

/* buscador reutilizable (Dashboard y Movimientos) */
function movSearch(root,o){
  const t=today();
  root.innerHTML=`<div class="row"><div><label>Usuario</label><input id="fU" placeholder="buscar usuario…" autocomplete="off"></div><div><label>Tipo</label><select id="fK"><option value="">Cargas y retiros</option><option value="carga">Solo cargas</option><option value="retiro">Solo retiros</option></select></div>
  <div><label>Desde</label><input type="date" id="fD" value="${o.from||t}"></div><div><label>Hasta</label><input type="date" id="fH" value="${t}"></div></div>
  <div class="row"><div><label>Monto desde ($)</label><input id="fA" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label>Monto hasta ($)</label><input id="fB" type="number" min="0" step="0.01" inputmode="decimal"></div>
  <div><label>Cajero</label><input id="fC" placeholder="nombre" autocomplete="off"></div><button class="btn" id="fS">Buscar</button></div>
  <div class="sw" style="margin-top:8px"><input type="checkbox" id="fV"><label style="margin:0">Mostrar también las anuladas</label></div>
  ${isAdm()?"":`<p class="sub" style="margin:8px 0 0">Ves los movimientos de los últimos ${S.cfg.op_history_days} día(s).</p>`}<div id="fL" style="margin-top:12px"></div>`;
  const g=id=>root.querySelector("#"+id);
  const load=async()=>{
    let r=sb.from("g_movements").select("*").gte("ts",dayISO(g("fD").value||t)).lt("ts",dayISO(addDays(g("fH").value||t,1))).order("ts",{ascending:false}).limit(500);
    if(!g("fV").checked)r=r.eq("voided",false);
    if(g("fU").value.trim())r=r.ilike("user_name","%"+g("fU").value.trim()+"%");
    if(g("fK").value)r=r.eq("kind",g("fK").value);
    if(g("fC").value.trim())r=r.ilike("cajero_name","%"+g("fC").value.trim()+"%");
    if(g("fA").value!=="")r=r.gte("amount",N(g("fA").value));
    if(g("fB").value!=="")r=r.lte("amount",N(g("fB").value));
    const rows=await q(r);const live=rows.filter(x=>!x.voided);
    const c=live.filter(x=>x.kind==="carga"),re=live.filter(x=>x.kind==="retiro");
    const info=`<p class="sub">${rows.length} resultado(s)${rows.length>=500?" (mostrando los primeros 500)":""}`+
      (isAdm()?` · ${c.length} cargas: <b class="pos">${fm(c.reduce((a,x)=>a+N(x.amount),0))}</b> · ${re.length} retiros: <b class="neg">${fm(re.reduce((a,x)=>a+N(x.amount),0))}</b>`:"")+"</p>";
    g("fL").innerHTML=info+movTable(rows,true);
    g("fL").onclick=ev=>{const e=ev.target.closest("[data-e]"),x=ev.target.closest("[data-x]"),cl=ev.target.closest("[data-c]");
      if(cl)claimMov(rows.find(m=>m.id===cl.dataset.c),async()=>{await load();if(o.onChange)await o.onChange()});
      if(e)editMov(rows.find(m=>m.id===e.dataset.e),async()=>{await load();if(o.onChange)await o.onChange()});
      if(x)voidMov(rows.find(m=>m.id===x.dataset.x),async()=>{await load();if(o.onChange)await o.onChange()})}};
  g("fS").onclick=()=>run(g("fS"),load);
  root.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox")run(null,load)});
  g("fV").onchange=()=>run(null,load);
  return load;
}

function editMov(m,after){
  const d=modal(`<h2>Editar ${KIND[m.kind].toLowerCase()}</h2>${movFields(m)}<div class="row" style="margin-top:12px"><button class="btn g" id="eC">Cancelar</button><button class="btn" id="eS">Guardar</button></div>`);
  const get=movWire(d);d.querySelector("#eC").onclick=()=>d.remove();
  d.querySelector("#eS").onclick=()=>run(d.querySelector("#eS"),async()=>{const v=get(),e=chk(v);if(e){toast(e,true);return}
    await rpc("g_edit_movement",{p_shift:sid(),p_id:m.id,p_user:v.user,p_amount:v.amount,p_bonus_type:v.bt,p_bonus_value:v.kind==="carga"?v.bv:0,p_chip:v.chip,p_wallet:v.wallet,p_ad:v.kind==="carga"?v.ad:null,p_bsrc:v.kind==="carga"?v.bsrc:null,p_bded:v.kind==="retiro"?v.bded:0});

}
function voidMov(m,after){
  const d=modal(`<h2>Anular ${KIND[m.kind].toLowerCase()}</h2><p>${KIND[m.kind]} de <b>${fm(m.amount)}</b> · ${esc(m.user_name)} · ${fdt(m.ts)}<br><span class="mut">Se devuelven el saldo de la billetera y las fichas. Queda registrada como anulada.</span></p>

  <div class="err" id="vE"></div><div class="row" style="margin-top:8px"><button class="btn g" id="vC">Cancelar</button><button class="btn d" id="vS">Anular</button></div>`);
  d.querySelector("#vC").onclick=()=>d.remove();
  d.querySelector("#vS").onclick=()=>run(d.querySelector("#vS"),async()=>{const r=d.querySelector("#vR").value.trim();
    if(r.length<5){d.querySelector("#vE").textContent="Escribí el motivo (mínimo 5 letras).";return}
    await rpc("g_void_movement",{p_shift:sid(),p_id:m.id,p_reason:r});d.remove();toast("Anulada ✓");await loadRef();await after()});
}

async function ledger(kind,item){
  const tb=kind==="w"?"g_wallet_tx":"g_chip_tx",col=kind==="w"?"wallet_id":"chip_id";
  const rows=await q(sb.from(tb).select("*").eq(col,item.id).order("ts",{ascending:false}).limit(200));
  modal(`<h2>${esc(item.name)} · movimientos</h2><div class="tw"><table><tr><th>Fecha</th><th>Tipo</th><th>Importe</th><th>Detalle</th><th>Cajero</th></tr>`+
    (rows.map(r=>`<tr><td>${fdt(r.ts)}</td><td>${KIND[r.kind]||r.kind}</td><td class="${N(r.amount)>=0?"pos":"neg"}">${N(r.amount)>=0?"+":""}${kind==="w"?fm(r.amount):fn(r.amount)}</td><td>${esc(r.descr)}</td><td>${esc(r.cajero)}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">Sin movimientos en el período visible.</td></tr>')+
    '</table></div><button class="btn g full" onclick="this.closest(\'.ov\').remove()">Cerrar</button>',true);
}

    <div class="bal">${fm(w.balance)}</div><div class="acts"><button class="btn g s" data-l="${w.id}">Ver movimientos</button>${w.archived?"":`<button class="btn g s" data-rd="${w.id}">Rend</button>`}

function transfer(fromId,after){
  const W=actW();if(W.length<2){toast("Necesitás al menos 2 billeteras para transferir.",true);return}
  const d=modal(`<h2>Transferir entre billeteras</h2><label>Desde</label><select id="tF">${opts(W,fromId||W[0].id,w=>w.name+" ("+fm(w.balance)+")")}</select>
  <label>Hacia</label><select id="tT"></select><div class="prev" id="tI"></div>
  <label>Monto ($)</label><div class="row"><input id="tA" type="number" step="0.01" min="0" inputmode="decimal"><button class="btn g s" id="tAll" type="button">Todo el saldo</button></div>
  <label>Detalle (opcional)</label><input id="tD" maxlength="150" placeholder="Ej: pasar a la cuenta de retiros">
  <div class="row" style="margin-top:12px"><button class="btn g" id="tX">Cancelar</button><button class="btn" id="tS">Transferir</button></div>`);
  const g=id=>d.querySelector("#"+id),W2=()=>S.wallets.find(w=>w.id===g("tF").value);
  const fillTo=()=>{const keep=g("tT").value;g("tT").innerHTML=opts(W.filter(w=>w.id!==g("tF").value),null,w=>w.name+" ("+fm(w.balance)+")");
    if(keep&&[...g("tT").options].some(o=>o.value===keep))g("tT").value=keep};
  const info=()=>{const a=W2(),b=S.wallets.find(w=>w.id===g("tT").value),m=N(g("tA").value);
    g("tI").innerHTML=b?`${esc(a.name)} <b>${fm(a.balance)}</b> → ${esc(b.name)} <b>${fm(b.balance)}</b>${m>0?`<br><span class="mut">Después: ${esc(a.name)} ${fm(N(a.balance)-m)} · ${esc(b.name)} ${fm(N(b.balance)+m)}</span>`:""}`:""};
  g("tF").onchange=()=>{fillTo();info()};g("tT").onchange=info;g("tA").oninput=info;
  g("tAll").onclick=()=>{g("tA").value=W2().balance;info()};
  fillTo();info();
  g("tX").onclick=()=>d.remove();
  g("tS").onclick=()=>run(g("tS"),async()=>{await rpc("g_wallet_transfer",{p_from:g("tF").value,p_to:g("tT").value,p_amount:N(g("tA").value),p_descr:g("tD").value,p_shift:sid()});
    d.remove();toast("Transferido ✓");await loadRef();if(after)await after();else go("bill")});
}
function rend(id,after){
  const w=S.wallets.find(x=>x.id===id);if(!w)return;
  const d=modal(`<h2>Rendimiento · ${esc(w.name)}</h2><p class="mut">Saldo actual <b>${fm(w.balance)}</b>. Lo que cargues se suma a esta billetera.</p>
  <label>Monto del rendimiento ($)</label><input id="rA" type="number" step="0.01" min="0" inputmode="decimal"><div class="prev" id="rI"></div>
  <label>Detalle (opcional)</label><input id="rD" maxlength="150" placeholder="Ej: rendimiento del día">
  <div class="row" style="margin-top:12px"><button class="btn g" id="rX">Cancelar</button><button class="btn" id="rS">Sumar</button></div>`);
  const g=i=>d.querySelector("#"+i);
  g("rA").oninput=()=>{const m=N(g("rA").value);g("rI").innerHTML=m>0?`${fm(w.balance)} + ${fm(m)} = <b>${fm(N(w.balance)+m)}</b>`:""};
  g("rX").onclick=()=>d.remove();g("rA").focus();
  g("rS").onclick=()=>run(g("rS"),async()=>{const m=N(g("rA").value);if(!(m>0)){toast("Poné un monto mayor a 0.",true);return}
    await rpc("g_wallet_rend",{p_wallet:id,p_amount:m,p_descr:g("rD").value,p_shift:sid()});d.remove();toast("Rendimiento sumado ✓");await loadRef();await after()});
}

VIEWS.gas=async function(){
  const t=today();
  const allCats=await q(sb.from("g_expense_cats").select("*").order("name"));
  const cats=allCats.filter(c=>!c.is_salary);S.cats=cats;
  const salCat=allCats.find(c=>c.is_salary);const fcats=[...(salCat&&salCat.active?[salCat]:[]),...cats.filter(c=>c.active)];
  $("view").innerHTML=`<div class="grid g2"><div class="card"><h2>Nuevo gasto</h2>
  <label>Categoría</label><select id="gC">${opts(fcats)}</select>
  <div id="gCjB" class="hide"><label>¿A qué cajero le pagás el sueldo?</label><select id="gCj">${opts(S.cajeros.filter(c=>c.active))}</select><p class="sub" style="margin:6px 0 0">Se anota solo en la solapa de sueldos del cajero.</p></div>
  <div class="row"><div><label>Monto ($)</label><input id="gA" type="number" step="0.01" min="0" inputmode="decimal"></div><div><label>Sale de</label><select id="gW"></select></div></div>
  <div id="gCuB" class="hide"><label>¿De dónde sale? (ej: Efectivo, Billetera de Juan)</label><input id="gCu" maxlength="40" placeholder="Efectivo"></div>
  <label id="gDl">Descripción</label><input id="gD" maxlength="300"><div id="gRB"><label>Responsable</label><input id="gR" maxlength="60" value="${esc(isAdm()?"":S.shift.name)}"></div>
  <label>Comprobante (opcional)</label><input id="gF" type="file" accept="image/*,application/pdf">
  <button class="btn full" id="gS">Registrar gasto</button></div>
  ${isAdm()?`<div class="card"><h2>Categorías</h2>${cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b2)"><span${c.active?"":' class="mut"'}>${esc(c.name)}</span><button class="btn g s" data-ct="${c.id}">${c.active?"Desactivar":"Activar"}</button></div>`).join("")}
  <div class="row" style="margin-top:10px"><input id="gNC" placeholder="Nueva categoría" maxlength="40"><button class="btn s" id="gAC">Agregar</button></div></div>`:""}</div>
  <div class="card" style="margin-top:12px"><div class="row"><div><label>Desde</label><input type="date" id="xD" value="${addDays(t,-29)}"></div><div><label>Hasta</label><input type="date" id="xH" value="${t}"></div><button class="btn" id="xB">Ver</button></div><div id="xL" style="margin-top:10px"></div></div>`;
  const isSal=()=>!!(salCat&&$("gC").value===salCat.id);
  const wopts=()=>{const sel=$("gW").value;$("gW").innerHTML=opts(actW(),null,w=>w.name+" ("+fm(w.balance)+")")+(isSal()?WCUST:"");if(sel&&[...$("gW").options].some(o=>o.value===sel))$("gW").value=sel};
  const gui=()=>{const sl=isSal();$("gCjB").classList.toggle("hide",!sl);$("gRB").classList.toggle("hide",sl);$("gDl").textContent=sl?"Nota (ej: adelanto)":"Descripción";wopts();$("gCuB").classList.toggle("hide",!(sl&&$("gW").value==="__c"))};
  $("gC").onchange=gui;$("gW").onchange=()=>$("gCuB").classList.toggle("hide",!(isSal()&&$("gW").value==="__c"));gui();
  $("gS").onclick=()=>run($("gS"),async()=>{
    const f=$("gF").files[0];let path=null;
    if(f){if(f.size>8e6){toast("El archivo pesa más de 8 MB",true);return}
      path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+f.name.replace(/[^\w.\-]/g,"_").slice(-40);
      const r=await sb.storage.from("g-docs").upload(path,f);if(r.error)throw new Error("No se pudo subir el comprobante: "+r.error.message)}
    if(isSal()){
      if(!$("gCj").value){toast("Elegí el cajero",true);return}
      const cust=$("gW").value==="__c";
      await rpc("g_pay_salary_op",{p_shift:sid(),p_cajero:$("gCj").value,p_amount:N($("gA").value),p_wallet:cust?null:$("gW").value,p_custom:cust?$("gCu").value:null,p_note:$("gD").value,p_doc:path});
      toast("Sueldo registrado en la solapa de sueldos ✓");go("gas");return}
    await rpc("g_add_expense",{p_shift:sid(),p_cat:$("gC").value,p_amount:N($("gA").value),p_wallet:$("gW").value,p_descr:$("gD").value,p_responsible:$("gR").value,p_doc:path});
    toast("Gasto registrado ✓");go("gas")});
  if(isAdm()){
    $("view").querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>run(b,async()=>{const c=cats.find(x=>x.id===b.dataset.ct);await q(sb.from("g_expense_cats").update({active:!c.active}).eq("id",c.id));go("gas")}));
    $("gAC").onclick=()=>run($("gAC"),async()=>{const n=$("gNC").value.trim();if(!n)return;await q(sb.from("g_expense_cats").insert({name:n}));go("gas")});
  }
  const load=async()=>{const rows=await q(sb.from("g_expenses").select("*").gte("ts",dayISO($("xD").value)).lt("ts",dayISO(addDays($("xH").value,1))).order("ts",{ascending:false}).limit(300));
    const tot=rows.reduce((a,x)=>a+N(x.amount),0);
    $("xL").innerHTML=`<p class="sub">${rows.length} gastos · <b>${fm(tot)}</b></p><div class="tw"><table><tr><th>Fecha</th><th>Categoría</th><th>Monto</th><th>Billetera</th><th>Descripción</th><th>Resp.</th><th></th></tr>`+
    rows.map(e=>`<tr><td>${fdt(e.ts)}</td><td>${esc(e.cat_name)}${e.adm_only?' <span class="pill">sueldo</span>':""}</td><td>${fm(e.amount)}</td><td>${esc(wLabel(e.wallet_id,e.paid_from))}</td><td>${esc(e.descr)}</td><td>${esc(e.responsible)}</td>
    <td class="acts">${e.doc_path&&isAdm()?`<button class="btn g s" data-d="${esc(e.doc_path)}">📎</button>`:e.doc_path?"📎":""}${canEditMov()&&!e.adm_only?`<button class="btn g s" data-ge="${e.id}">Editar</button><button class="btn d s" data-gx="${e.id}">Borrar</button>`:""}${isAdm()&&e.adm_only?`<button class="btn d s" data-gx="${e.id}">Anular</button>`:""}</td></tr>`).join("")+"</table></div>";
    $("xL").onclick=ev=>{const dd=ev.target.closest("[data-d]"),ge=ev.target.closest("[data-ge]"),gx=ev.target.closest("[data-gx]");
      if(dd)run(null,async()=>{const r=await sb.storage.from("g-docs").createSignedUrl(dd.dataset.d,120);if(r.error)throw new Error(r.error.message);window.open(r.data.signedUrl,"_blank")});
      if(ge)editExp(rows.find(x=>x.id===ge.dataset.ge),load);if(gx)delExp(rows.find(x=>x.id===gx.dataset.gx),load)}};
  $("xB").onclick=()=>run($("xB"),load);await load();
};

    <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Gastos por categoría</h3>${(m.gastos_cat||[]).map(x=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(x.cat)}</span><b>${fm(x.total)}</b></div><div class="bar"><i style="width:${N(x.total)/mx*100}%"></i></div></div>`).join("")||'<p class="mut">Sin gastos.</p>'}</div>
    <div class="card"><h3>Por cajero</h3><div class="tw"><table><tr><th>Cajero</th><th>Cargas</th><th>Monto</th><th>Retiros</th></tr>${(m.cajeros||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.cargas_n}</td><td class="pos">${fm(x.cargas)}</td><td class="neg">${fm(x.retiros)}</td></tr>`).join("")||'<tr><td colspan="4" class="mut">Sin datos.</td></tr>'}</table></div></div></div>
    <div class="card" style="margin-top:12px"><h3>Billeteras</h3><div class="tw"><table><tr><th>Billetera</th><th>Entradas</th><th>Salidas</th><th>Saldo actual</th></tr>${(m.billeteras||[]).map(x=>`<tr><td>${esc(x.name)}</td><td class="pos">${fm(x.entradas)}</td><td class="neg">${fm(x.salidas)}</td><td><b>${fm(x.saldo)}</b></td></tr>`).join("")}</table></div></div>`};
  $("mB").onclick=()=>run($("mB"),load);await load();
};

VIEWS.rep=async function(){
  S.repBusy=true;
  const rows=await q(sb.from("g_shift_reports").select("*").order("ended_at",{ascending:false}).limit(60));
  const wa=(()=>{try{return localStorage.getItem("g_wa")||""}catch(e){return""}})();
  const txt=r=>{const d=r.data||{};return `*Reporte de turno · ${r.cajero_name}*\n${fdt(r.started_at)} → ${fdt(r.ended_at)}\n\n`+
    `Cargas: ${d.cargas_n} · ${fm(d.cargas)}\nRetiros: ${d.retiros_n} · ${fm(d.retiros)}\nBonos: ${fm(d.bonos)}\nGastos: ${d.gastos_n} · ${fm(d.gastos)}\n\n`+
    `*Fichas*\n`+(d.por_ficha||[]).map(f=>`${f.name}: entregadas ${fn(f.entregadas)}, devueltas ${fn(f.devueltas)}, stock ${fn(f.stock)}`).join("\n")+
    `\n\n*Billeteras*\n`+(d.billeteras||[]).map(w=>`${w.name}: ${fm(w.saldo)}`).join("\n")};
  $("view").innerHTML=`<div class="row" style="margin-bottom:12px;align-items:center"><div><h2 style="margin:0">Reportes de turno</h2><span class="mut">Se genera uno cada vez que un cajero cierra su turno.</span></div>
  <button class="btn g" id="rA">Marcar todos como leídos</button></div>
  <div class="card" style="margin-bottom:12px"><label style="margin-top:0">Número de WhatsApp para reenviar (con código de país, sin +) — opcional</label><input id="rW" placeholder="5491122334455" value="${esc(wa)}" inputmode="numeric"></div>`+
  (rows.map(r=>{const d=r.data||{};return `<div class="card" style="margin-bottom:10px;${r.seen?"":"border-color:var(--a)"}">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(r.cajero_name)} ${r.seen?"":'<span class="pill" style="color:var(--a)">nuevo</span>'}</b><span class="mut">${fdt(r.started_at)} → ${fdt(r.ended_at)}</span></div>
    <div class="grid g4" style="margin:10px 0"><div><div class="mut">Cargas (${d.cargas_n})</div><b class="pos">${fm(d.cargas)}</b></div><div><div class="mut">Retiros (${d.retiros_n})</div><b class="neg">${fm(d.retiros)}</b></div><div><div class="mut">Bonos</div><b>${fm(d.bonos)}</b></div><div><div class="mut">Gastos (${d.gastos_n})</div><b>${fm(d.gastos)}</b></div></div>
    <div class="tw"><table><tr><th>Ficha</th><th>Entregadas</th><th>Devueltas</th><th>Stock al cierre</th></tr>${(d.por_ficha||[]).map(f=>`<tr><td>${esc(f.name)}</td><td>${fn(f.entregadas)}</td><td>${fn(f.devueltas)}</td><td>${fn(f.stock)}</td></tr>`).join("")||'<tr><td colspan="4" class="mut">Sin movimientos de fichas.</td></tr>'}</table></div>
    <p class="sub" style="margin:8px 0">Billeteras al cierre: ${(d.billeteras||[]).map(w=>`${esc(w.name)} <b>${fm(w.saldo)}</b>`).join(" · ")||"—"}</p>
    <div class="acts"><button class="btn g s" data-wa="${r.id}">Enviar por WhatsApp</button></div></div>`}).join("")||'<div class="card"><p class="mut">Todavía no hay reportes. Aparecen cuando un cajero cierra su turno con actividad.</p></div>');
  $("rW").onchange=()=>{try{localStorage.setItem("g_wa",$("rW").value.replace(/\D/g,""))}catch(e){}};
  $("rA").onclick=()=>run($("rA"),async()=>{await rpc("g_reports_mark_seen");repLast=0;toast("Listo ✓");await VIEWS.rep();repCheck()});
  $("view").onclick=ev=>{const b=ev.target.closest("[data-wa]");if(!b)return;const r=rows.find(x=>x.id===b.dataset.wa),n=$("rW").value.replace(/\D/g,"");
    window.open("https://wa.me/"+n+"?text="+encodeURIComponent(txt(r)),"_blank")};
  S.repBusy=false;
  if(rows.some(r=>!r.seen)){await rpc("g_reports_mark_seen");repLast=0;const bb=document.querySelector('#nav button[data-t=rep]');if(bb)bb.textContent="Reportes"}
};


/* ---------- Ranking de usuarios / jugadores (solo admin) ---------- */
VIEWS.bon=async function(){
  const t=today();
  $("view").innerHTML=`<div class="card"><div class="row" style="align-items:center"><div><h2 style="margin:0">🎁 Bonos por origen</h2><p class="sub" style="margin:4px 0 0">Cargas que vinieron con bono (Referidos, Estados de WhatsApp, etc.), separadas de Publicidad. Las anuladas no cuentan.${isAdm()?"":` Ves los últimos ${S.cfg.op_history_days} día(s).`}</p></div>${isAdm()?'<button class="btn" id="bnN">+ Nuevo origen</button>':""}</div>
  <div class="row" style="margin-top:10px"><div><label>Desde</label><input type="date" id="bD" value="${isAdm()?addDays(t,-29):t}"></div><div><label>Hasta</label><input type="date" id="bH" value="${t}"></div><button class="btn" id="bB">Ver</button></div></div>
  <div class="card" style="margin-top:12px" id="bR"></div>
  ${isAdm()?'<div class="card" style="margin-top:12px" id="bO"></div>':""}`;
  const load=async()=>{const r=await rpc("g_bonus_report",{p_from:dayISO($("bD").value||t),p_to:dayISO(addDays($("bH").value||t,1))});
    const tb=r.reduce((a,x)=>a+N(x.bonos),0),tn=r.reduce((a,x)=>a+N(x.cargas_n),0);
    $("bR").innerHTML=r.length?`<div class="tw"><table><tr><th>Origen</th><th>Cargas con bono</th><th>Usuarios</th><th>Monto cargado</th><th>Bono otorgado</th></tr>`+r.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${fn(x.cargas_n)}</td><td>${fn(x.usuarios)}</td><td>${fm(x.cargas)}</td><td>${fm(x.bonos)}</td></tr>`).join("")+`<tr><td><b>Total</b></td><td><b>${fn(tn)}</b></td><td></td><td></td><td><b>${fm(tb)}</b></td></tr></table></div>`:'<p class="mut">No hay cargas con bono en ese período.</p>'};
  const own=async()=>{if(!isAdm())return;const l=await q(sb.from("g_bonus_src").select("*").order("created_at"));
    $("bO").innerHTML="<h3>Orígenes disponibles</h3>"+l.map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b2)"><span${b.archived?' style="opacity:.5"':""}>${esc(b.name)}${b.archived?' <span class="pill">oculto</span>':""}</span><button class="btn g s" data-ar="${b.id}" data-v="${b.archived?0:1}">${b.archived?"Mostrar":"Ocultar"}</button></div>`).join("");
    $("bO").onclick=ev=>{const b=ev.target.closest("[data-ar]");if(b)run(b,async()=>{await rpc("g_bonus_src_archive",{p_id:b.dataset.ar,p_archived:b.dataset.v==="1"});await loadRef();await own()})}};
  $("bB").onclick=()=>run($("bB"),load);
  if(isAdm())$("bnN").onclick=()=>{const d=modal(`<h2>Nuevo origen de bono</h2><label>Nombre</label><input id="nN" maxlength="40" placeholder="Ej: Sorteo de Instagram"><div class="row" style="margin-top:12px"><button class="btn g" id="nX">Cancelar</button><button class="btn" id="nS">Crear</button></div>`);
    d.querySelector("#nX").onclick=()=>d.remove();d.querySelector("#nS").onclick=()=>run(d.querySelector("#nS"),async()=>{const v=d.querySelector("#nN").value.trim();if(!v){toast("Poné un nombre.",true);return}await rpc("g_bonus_src_add",{p_name:v});d.remove();toast("Origen creado ✓");await loadRef();await own()})};
  await load();await own();
};
VIEWS.usr=async function(){
  const t=today();
  $("view").innerHTML=`<div class="card"><h2>Ranking de usuarios</h2><p class="sub">Jugadores ordenados por cantidad de cargas. Las anuladas no cuentan.${isAdm()?"":` Ves los últimos ${S.cfg.op_history_days} día(s).`}</p>
  <div class="row"><div><label>Buscar usuario</label><input id="uQ" placeholder="nombre del usuario…" autocomplete="off"></div>
  <div><label>Período</label><select id="uP"><option value="total">Todo el historial</option><option value="hoy">Hoy</option><option value="7">Últimos 7 días</option><option value="mes">Este mes</option><option value="x">Personalizado</option></select></div>
  <div><label>Ordenar por</label><select id="uO"><option value="cargas_n">Cantidad de cargas</option><option value="cargas">Monto cargado</option><option value="retiros_n">Cantidad de retiros</option><option value="retiros">Monto retirado</option><option value="neto">Neto (cargas − retiros)</option><option value="ultima">Última actividad</option></select></div></div>
  <div class="row hide" id="uX"><div><label>Desde</label><input type="date" id="uD" value="${addDays(t,-29)}"></div><div><label>Hasta</label><input type="date" id="uH" value="${t}"></div></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="uB">Buscar</button></div></div><div id="uR" style="margin-top:12px"></div>`;
  const rng=()=>{const p=$("uP").value;if(p==="total")return[null,null];
    if(p==="hoy")return[dayISO(t),dayISO(addDays(t,1))];if(p==="7")return[dayISO(addDays(t,-6)),dayISO(addDays(t,1))];
    if(p==="mes")return[dayISO(t.slice(0,8)+"01"),dayISO(addDays(t,1))];return[dayISO($("uD").value||t),dayISO(addDays($("uH").value||t,1))]};
  const load=async()=>{const [f,to]=rng();
    const rows=await rpc("g_users_ranking",{p_from:f,p_to:to,p_search:$("uQ").value,p_sort:$("uO").value});
    const tc=rows.reduce((a,x)=>a+N(x.cargas),0),tr=rows.reduce((a,x)=>a+N(x.retiros),0);
    const medal=i=>i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1;
    $("uR").innerHTML=`<div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><div class="l">Usuarios</div><div class="v">${rows.length}</div></div><div class="card kpi"><div class="l">Total cargado</div><div class="v pos">${fm(tc)}</div></div><div class="card kpi"><div class="l">Total retirado</div><div class="v neg">${fm(tr)}</div></div><div class="card kpi"><div class="l">Neto</div><div class="v">${fm(tc-tr)}</div></div></div>
    <div class="card"><div class="tw"><table><tr><th>#</th><th>Usuario</th><th>Cargas</th><th>Monto cargado</th><th>Retiros</th><th>Monto retirado</th><th>Neto</th><th>Última actividad</th><th></th></tr>`+
    rows.map((u,i)=>`<tr><td>${medal(i)}</td><td><b>${esc(u.name)}</b></td><td><b>${u.cargas_n}</b></td><td class="pos">${fm(u.cargas)}</td><td>${u.retiros_n}</td><td class="neg">${fm(u.retiros)}</td><td class="${N(u.neto)>=0?"pos":"neg"}">${fm(u.neto)}</td><td>${fdt2(u.ultima)}</td><td><button class="btn g s" data-u="${i}">Ver</button></td></tr>`).join("")+
    `</table></div>${rows.length?"":'<p class="mut">No hay usuarios con esos filtros.</p>'}${rows.length>=500?'<p class="sub">Mostrando los primeros 500.</p>':""}</div>`;
    $("uR").onclick=ev=>{const b=ev.target.closest("[data-u]");if(b)userDetail(rows[+b.dataset.u],f,to)}};
  $("uP").onchange=()=>{$("uX").classList.toggle("hide",$("uP").value!=="x");if($("uP").value!=="x")run(null,load)};
  $("uO").onchange=()=>run(null,load);
  $("uB").onclick=()=>run($("uB"),load);
  $("uQ").onkeydown=e=>{if(e.key==="Enter")run(null,load)};
  await load();
};
async function userDetail(u,f,to){
  const esc2=u.name.replace(/[\\%_]/g,m=>"\\"+m);
  let r=sb.from("g_movements").select("*").eq("voided",false).ilike("user_name",esc2).order("ts",{ascending:false}).limit(200);
  if(f)r=r.gte("ts",f);if(to)r=r.lt("ts",to);
  const rows=await run(null,()=>q(r));if(!rows)return;
  modal(`<h2>${esc(u.name)}</h2><div class="grid g4" style="margin-bottom:10px"><div><div class="mut">Cargas (${u.cargas_n})</div><b class="pos">${fm(u.cargas)}</b></div><div><div class="mut">Retiros (${u.retiros_n})</div><b class="neg">${fm(u.retiros)}</b></div><div><div class="mut">Bonos recibidos</div><b>${fm(u.bonos)}</b></div><div><div class="mut">Neto</div><b class="${N(u.neto)>=0?"pos":"neg"}">${fm(u.neto)}</b></div></div>
  <p class="sub">Primera actividad: ${fdt2(u.primera)} · Última: ${fdt2(u.ultima)}</p>
  ${movTable(rows,false)}<button class="btn g full" onclick="this.closest('.ov').remove()">Cerrar</button>`,true);
}

/* ---------- Ajustes y auditoría (solo admin) ---------- */
const AUD={billetera_ajuste:["⚖️","Ajuste de billetera"],billetera_crear:["➕","Billetera"],billetera_rend:["📈","Rendimientos"],billetera_transf:["🔁","Transferencias"],cajero_clave:["🔑","Cajeros"],cajero_crear:["👤","Cajeros"],campana_crear:["📣","Publicidad"],campana_estado:["📣","Publicidad"],ficha_ajuste:["🎰","Fichas"],ficha_crear:["🎰","Fichas"],gasto_borrar:["🧾","Gastos"],gasto_editar:["🧾","Gastos"],mov_anular:["🚫","Anulaciones"],mov_editar:["✏️","Ediciones"],mov_reclamar:["✅","Pagos reclamados"],sueldo_pago:["💵","Sueldos"],billetera_alta:["➕","Billetera"]};
function auditWho(a){const d=a.detail||{};const n=d.cajero||d.por;const r=a.actor==="admin"?"Admin":a.actor==="operador"||a.actor==="operator"?"Operador":a.actor;return n&&n!==r&&n!=="admin"?`${esc(n)} <span class="mut">(${esc(r)})</span>`:esc(n==="admin"?"Admin":r)}
function auditText(a){const d=a.detail||{},m=d.mov||d.antes||{};const W=id=>esc(wName(id)||"—"),C=id=>esc(cName(id)||"—");
  const mv=x=>x&&x.kind?`${x.kind==="carga"?"carga":"retiro"} de <b>${fm(x.amount)}</b> del usuario <b>${esc(x.user_name||"")}</b> (${W(x.wallet_id)}${x.chip_id?" · "+C(x.chip_id):""}${x.bonus>0?" · bono "+fm(x.bonus):""})`:"un movimiento";
  switch(a.action){
    case"mov_anular":return`Anuló la ${mv(d.mov)}.${d.motivo?` Motivo: <i>${esc(d.motivo)}</i>`:""}`;
    case"mov_editar":return`Editó la ${mv(d.antes)}. <span class="mut">(se muestran los datos de antes de editar)</span>`;
    case"mov_reclamar":return`Reclamó un pago sin reclamar: usuario <b>${esc(d.usuario||"")}</b> · ficha ${C(d.chip)}.`;
    case"billetera_transf":return`Transfirió <b>${fm(d.amount)}</b> de <b>${W(d.from)}</b> a <b>${W(d.to)}</b>.`;
    case"billetera_rend":return`Sumó un rendimiento de <b>${fm(d.amount)}</b> a <b>${W(d.wallet)}</b>.`;
    case"billetera_ajuste":return`${d.kind==="ajuste-"?"Restó":"Sumó"} <b>${fm(d.amount)}</b> ${d.kind==="ajuste-"?"de":"a"} <b>${W(d.wallet)}</b>${d.descr?` · <i>${esc(d.descr)}</i>`:""}.`;
    case"billetera_crear":return`Creó la billetera <b>${esc(d.name||"")}</b> con saldo inicial ${fm(d.inicial||0)}.`;
    case"ficha_ajuste":return`${d.kind==="compra"?"Registró compra de":d.kind==="ajuste-"?"Restó":"Cargó"} <b>${fn(d.amount)}</b> fichas ${d.kind==="ajuste-"?"de":"a"} <b>${C(d.chip)}</b>${d.descr?` · <i>${esc(d.descr)}</i>`:""}.`;
    case"ficha_crear":return`Creó la ficha <b>${esc(d.name||"")}</b> con stock inicial ${fn(d.inicial||0)}.`;
    case"gasto_borrar":return`Borró un gasto${d.gasto?` de <b>${fm(d.gasto.amount)}</b> (${esc(d.gasto.category||"")})`:""}.`;
    case"gasto_editar":return`Editó un gasto${d.antes?` de <b>${fm(d.antes.amount)}</b> (${esc(d.antes.category||"")})`:""}.`;
    case"sueldo_pago":return`Pagó <b>${fm(d.amount)}</b> de sueldo a <b>${esc(d.cajero||"")}</b>${d.period?` (${esc(d.period)})`:""}${d.desde?` desde ${esc(d.desde)}`:""}.`;
    case"cajero_crear":return`Creó el cajero <b>${esc(d.name||"")}</b>.`;
    case"cajero_clave":return`Cambió la clave de un cajero.`;
    case"campana_crear":return`Creó la campaña <b>${esc(d.name||"")}</b>.`;
    case"campana_estado":return`Cambió la campaña <b>${esc(d.name||"")}</b> de ${esc(d.de||"")} a <b>${esc(d.a||"")}</b>.`;
    default:return esc(a.action)+" "+esc(JSON.stringify(d).slice(0,120))}}

VIEWS.cfg=async function(){
  const au=await q(sb.from("g_audit").select("*").order("ts",{ascending:false}).limit(100));
  $("view").innerHTML=`<div class="card"><h2>Permisos del operador</h2>
  <div class="sw"><input type="checkbox" id="cE"${S.cfg.op_can_edit?" checked":""}><label style="margin:0">Puede editar / anular movimientos y gastos</label></div>
  <label>Días de historial que ve el operador (1 = solo hoy)</label><input type="number" id="cD" min="1" max="31" value="${S.cfg.op_history_days}" style="max-width:120px">
  <p class="sub" style="margin-top:10px">El operador nunca ve métricas, sueldos, auditoría ni los números de publicidad.</p><button class="btn" id="cS">Guardar</button></div>
  <div class="card" style="margin-top:12px"><div class="row" style="align-items:center"><h2 style="margin:0">Auditoría (últimas 100)</h2><div><select id="auF"><option value="">Todas las acciones</option>${[...new Set(Object.values(AUD).map(x=>x[1]))].map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="tw" id="auT"></div></div>`;
  const auDraw=()=>{const f=$("auF").value,rows=au.filter(a=>!f||(AUD[a.action]||["","Otros"])[1]===f);
    $("auT").innerHTML=`<table><tr><th>Fecha</th><th>Quién</th><th>Qué hizo</th></tr>`+(rows.map(a=>`<tr><td style="white-space:nowrap">${fdt(a.ts)}</td><td>${auditWho(a)}</td><td>${(AUD[a.action]||["•"])[0]} ${auditText(a)}<details style="margin-top:3px"><summary class="mut" style="font-size:11px;cursor:pointer">detalle técnico</summary><code class="mut" style="font-size:11px;word-break:break-all">${esc(JSON.stringify(a.detail))}</code></details></td></tr>`).join("")||'<tr><td colspan="3" class="mut">Sin registros.</td></tr>')+"</table>"};
  $("auF").onchange=auDraw;auDraw();
  $("cS").onclick=()=>run($("cS"),async()=>{const n=Math.min(31,Math.max(1,Math.round(N($("cD").value)||2)));
    await q(sb.from("g_settings").upsert([{key:"op_can_edit",value:$("cE").checked},{key:"op_history_days",value:n}],{onConflict:"key"}));
    S.cfg={op_can_edit:$("cE").checked,op_history_days:n};toast("Guardado ✓")});
};

boot();
