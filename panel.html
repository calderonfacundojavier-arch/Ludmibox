<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Truco</title>
<style>
:root{--bg:#0e1522;--side:#0a101b;--card:#162033;--card2:#1b2740;--line:rgba(255,255,255,.09);--tx:#e8edf6;--mut:#8e9bb4;--gold:#f0c24b;--ok:#35c27a;--bad:#ef5b5b;--blue:#4c8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.mut{color:var(--mut)}
#app{min-height:100vh}
/* login */
.lg{max-width:360px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.lg h1{margin:0 0 4px;font-size:26px;letter-spacing:2px;color:var(--gold)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;flex:none}
.brand{font-weight:900;letter-spacing:3px;color:var(--gold);font-size:20px;padding:6px 12px 14px}
.side button.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer}
.side button.nv:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.side button.nv.on{background:rgba(240,194,75,.14);color:var(--gold);font-weight:700}
.side .sp{flex:1}
.who{padding:10px 12px;border-top:1px solid var(--line);margin-top:8px}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h2{margin:0;font-size:20px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.08)}
.pill.root{background:rgba(240,194,75,.2);color:var(--gold)}.pill.platform{background:rgba(76,141,255,.2);color:#8fb6ff}.pill.agent{background:rgba(53,194,122,.18);color:#6fe0a6}.pill.player{background:rgba(255,255,255,.08);color:var(--mut)}
.pill.off{background:rgba(239,91,91,.2);color:#ff9a9a}
/* controls */
.btn{background:var(--gold);color:#241a00;border:0;border-radius:9px;padding:9px 16px;font-weight:800;cursor:pointer}
.btn.g{background:rgba(255,255,255,.08);color:var(--tx);font-weight:600}.btn.s{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.ok{background:var(--ok);color:#06210f}.btn.bad{background:var(--bad);color:#fff}.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#0f1829;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:11px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;color:var(--mut);cursor:pointer;font-weight:600}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters>div{min-width:150px;flex:1}.filters label{margin-top:0}.filters .fx{flex:none;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--card2);text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:11px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.025)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kp .l{color:var(--mut);font-size:12px}.kp .v{font-size:23px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.pg{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:14px}
.pg button{min-width:34px}
.err{color:#ff9a9a;min-height:18px;font-size:13px;margin-top:8px}
.neg{color:#ff9a9a}.pos{color:#7fe0ad}
/* modal */
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#mdl.on{display:flex}
#mdl .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
#mdl h3{margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 18px;border-radius:99px;z-index:30}
/* árbol */
.tr ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.tr>ul{padding-left:0;border:0}
.tr li{margin:4px 0}
.tn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);width:fit-content;max-width:100%}
.tn .tg{cursor:pointer;width:18px;text-align:center;color:var(--gold);user-select:none}
@media(max-width:820px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}.side .sp,.brand{display:none}.main{padding:16px 12px 60px}.who{display:none}}
</style></head><body><div id="app"></div><div id="mdl"><div class="bx" id="mb"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=(n,d)=>Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:d==null?2:d});
const CR=n=>N(n)+" cr", ARS=n=>"$ "+N(n);
const ROLE={root:"Padre",platform:"Plataforma",agent:"Agente",player:"Jugador"};
const KIND={emision:"Créditos creados",deposito:"Carga recibida",retiro:"Retiro",envio:"Carga enviada",recibo:"Retiro recibido",apuesta:"Apuesta",devolucion:"Devolución",premio:"Premio",derrota:"Derrota",comision:"Comisión",bot:"Máquina (apuesta)"};
const dt=s=>new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const app=$("#app");
let tok=localStorage.getItem("pn_tok"),rtok=localStorage.getItem("pn_rtok"),ME=null,view="users",CFG=null;
let userRole={};
const US={group:"all",q:"",parent:"",page:0,per:25};

async function api(action,body,retry){
  const r=await fetch("/api/truco",{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({error:"Sin conexión"}));
  if(r.status===401&&!retry&&rtok&&action!=="login"&&action!=="refresh"){try{const n=await api("refresh",{refresh_token:rtok},true);setTok(n);return api(action,body,true)}catch(_){out();throw new Error("Sesión vencida")}}
  if(!r.ok)throw new Error(j.error||"Error");return j;
}
function setTok(s){tok=s.access_token;rtok=s.refresh_token;localStorage.setItem("pn_tok",tok);localStorage.setItem("pn_rtok",rtok)}
function out(){tok=rtok=null;localStorage.removeItem("pn_tok");localStorage.removeItem("pn_rtok");ME=null;login()}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function modal(html){$("#mb").innerHTML=html;$("#mdl").classList.add("on")}
function closeM(){$("#mdl").classList.remove("on")}
$("#mdl").addEventListener("mousedown",e=>{if(e.target.id==="mdl")closeM()});
const genPw=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s};

/* ---------- login ---------- */
function login(msg){
  app.innerHTML=`<div class="lg"><h1>TRUCO</h1><div class="mut">Panel de administración</div>
  <label>Usuario</label><input id="u" autocapitalize="none" autocomplete="username" maxlength="20"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="e">${E(msg||"")}</div><button class="btn" id="go" style="width:100%;margin-top:6px">Ingresar</button></div>`;
  const go=async()=>{$("#e").textContent="";$("#go").disabled=true;
    try{setTok(await api("login",{username:$("#u").value.trim(),password:$("#p").value}));start()}catch(e){$("#e").textContent=e.message;$("#go").disabled=false}};
  $("#go").onclick=go;app.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
}
async function start(){
  if(!tok)return login();
  try{
    const m=await api("me");
    if(m.role==="player"){out();return login("Las cuentas de jugador entran al juego, no al panel.")}
    ME=(await api("p_me")).me;
    try{CFG=await api("p_settings",{})}catch(_){}
    shell()
  }catch(e){if(tok)login(e.message)}
}

/* ---------- estructura ---------- */
const NAV=()=>[["home","Resumen","▦"],["users","Usuarios","👥"],["tree","Árbol de usuarios","⌥"],["tx","Movimientos","⇄"],["tables","Mesas","♠"],["bot","Máquina (RTP)","🎲"],...(ME.role==="root"?[["sales","Ventas de créditos","$"],["cfg","Configuración","⚙"]]:[])];
function shell(){
  app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">TRUCO</div>
  ${NAV().map(([k,t,i])=>`<button class="nv ${view===k?"on":""}" data-v="${k}"><span style="width:18px;text-align:center">${i}</span>${t}</button>`).join("")}
  <div class="sp"></div>
  <div class="who"><div><b>${E(ME.username)}</b> <span class="pill ${ME.role}">${ROLE[ME.role]}</span></div><div class="mut" style="margin:4px 0 8px">Créditos: <b id="mybal">${CR(ME.balance)}</b></div>${ME.role==="root"?'<button class="btn s" id="mint" style="margin-bottom:8px;width:100%">+ Crear créditos</button>':""}
  <button class="btn g s" id="pw">Cambiar contraseña</button> <button class="btn g s" id="lo">Salir</button></div></aside>
  <main class="main" id="mn"></main></div>`;
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;shell()});
  $("#lo").onclick=out;$("#pw").onclick=()=>pwModal(ME.username);if($("#mint"))$("#mint").onclick=mintModal;
  ({home,users,tree,tx,tables,sales,cfg,bot:botPage})[view]();
}
async function refreshMe(){try{ME=(await api("p_me")).me;const b=$("#mybal");if(b){b.textContent=CR(ME.balance)}}catch(_){}}


/* ---------- copiar ---------- */
function copyTxt(t){
  const ok=()=>toast("Copiado ✓");
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fallback())}else fallback();
  function fallback(){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("No se pudo copiar: seleccioná el texto a mano")}a.remove()}
}
const linkFor=role=>location.origin+(role==="player"?"/":"/panel");
const credText=(u,p,role)=>`TRUCO\nUsuario: ${u}\nClave: ${p}\nIngresá acá: ${linkFor(role)}`;
function credModal(title,u,p,role){
  modal(`<h3>${title}</h3><div class="mut">Guardá o enviá estos datos ahora: la clave no se puede volver a ver (si se pierde, se genera una nueva).</div>
  <div class="card" style="margin:12px 0;font-size:16px;line-height:1.8">Usuario: <b>${E(u)}</b><br>Clave: <b>${E(p)}</b><br>Link: <b style="word-break:break-all">${E(linkFor(role))}</b></div>
  <div class="act"><button class="btn" id="c1">Copiar usuario, clave y link</button><button class="btn g" id="c2">Copiar solo el link</button><button class="btn g" id="cl">Cerrar</button></div>`);
  $("#c1").onclick=()=>copyTxt(credText(u,p,role));$("#c2").onclick=()=>copyTxt(linkFor(role));$("#cl").onclick=()=>{closeM();refreshMe();view==="users"?users():shell()};
}
function mintModal(){
  modal(`<h3>Crear créditos</h3><div class="mut">Los créditos que crees quedan en tu cuenta. Después se los cargás a tus plataformas (y ahí se registra la venta al precio de cada una).</div>
  <label>Cantidad de créditos (1 crédito = $1)</label><input id="am" inputmode="decimal" autofocus placeholder="Ej: 1000000"><label>Nota (opcional)</label><input id="nt" maxlength="120">
  <div class="err" id="e"></div><div class="act" style="margin-top:10px"><button class="btn" id="ok">Crear</button><button class="btn g" id="cx">Cancelar</button></div>`);
  $("#cx").onclick=closeM;
  const go=async()=>{const a=Number(String($("#am").value).replace(/\./g,"").replace(",","."));if(!(a>0)){$("#e").textContent="Poné una cantidad válida";return}
    $("#ok").disabled=true;try{const r=await api("p_mint",{amount:a,note:$("#nt").value});closeM();toast("Creaste "+CR(a)+" · tenés "+CR(r.balance));await refreshMe();shell()}catch(e){$("#e").textContent=e.message;$("#ok").disabled=false}};
  $("#ok").onclick=go;$("#am").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ---------- resumen ---------- */
async function home(){
  const mn=$("#mn");
  mn.innerHTML=`<div class="top"><h2>Resumen</h2><select id="rg" style="width:auto"><option value="1">Hoy</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option></select></div><div id="hc" class="mut">Cargando…</div>`;
  const load=async()=>{const d=+$("#rg").value,from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-(d-1));
    const r=await api("p_report",{from:from.toISOString(),to:new Date(Date.now()+60000).toISOString()});
    const k=(l,v,c)=>`<div class="kp"><div class="l">${l}</div><div class="v ${c||""}">${v}</div></div>`;
    $("#hc").className="";$("#hc").innerHTML=`<div class="cards" style="margin-top:0">
      ${k("Mis créditos",CR(r.mine))}${r.emitted_total!=null?k("Créditos creados (total)",CR(r.emitted_total)):""}${k("Créditos en tu red",CR(r.credits_network))}
      ${k("Jugadores",N(r.players,0))}${k("Agentes / plataformas",N(r.agents,0))}
      ${k("Cargas a tus directos",CR(r.deposits),"pos")}${k("Retiros de tus directos",CR(r.withdrawals),"neg")}
      ${k("Mesas jugadas",N(r.tables,0))}${k("Apostado en mesas",CR(r.wagered))}
      ${k("Tu comisión",CR(r.commission),"pos")}
      ${Number(r.bot_wagered)>0?k("Apostado contra la máquina",CR(r.bot_wagered))+k("Pagado por la máquina",CR(r.bot_paid))+k("RTP real de la máquina",N(100*r.bot_paid/r.bot_wagered,1)+" %")+k("Ganancia de la máquina",CR(r.bot_wagered-r.bot_paid),r.bot_wagered-r.bot_paid>=0?"pos":"neg"):""}
      ${r.sold_credits!=null?k("Créditos vendidos",CR(r.sold_credits))+k("Facturado a plataformas",ARS(r.sold_ars),"pos"):""}</div>`};
  $("#rg").onchange=load;load().catch(e=>toast(e.message));
}

/* ---------- usuarios ---------- */
async function users(){
  const mn=$("#mn");
  mn.innerHTML=`<div class="top"><h2>Usuarios</h2><div class="act">${ME.role==="root"?'<button class="btn g" id="mt">+ Crear créditos</button>':""}<button class="btn" id="nw">+ Crear usuario</button></div></div>
  <div class="tabs">${[["all","Todos los usuarios"],["players","Jugadores"],["agents","Agentes"],["blocked","Usuarios bloqueados"]].map(([k,t])=>`<button data-g="${k}" class="${US.group===k?"on":""}">${t}</button>`).join("")}</div>
  <div class="filters"><div><label>Buscar usuario</label><input id="fq" value="${E(US.q)}" placeholder="Usuario o WhatsApp"></div>
  <div><label>Agente (padre directo)</label><input id="fp" value="${E(US.parent)}" placeholder="Nombre exacto"></div>
  <div style="max-width:120px"><label>Mostrar</label><select id="fn">${[10,25,50,100].map(n=>`<option ${US.per===n?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="fx"><button class="btn blue" id="fs">Buscar</button></div><div class="fx"><button class="btn g" id="fc">Limpiar</button></div></div>
  <div class="tw"><table><thead><tr><th>ID</th><th>Nombre</th><th>Depositar / Retirar</th><th class="n">Balance</th><th class="n">Comisión</th><th>Agente</th><th>Creado</th><th>Acciones</th></tr></thead><tbody id="tb"><tr><td colspan="8" class="mut">Cargando…</td></tr></tbody></table></div>
  <div class="pg" id="pg"></div><div class="cards" id="tt"></div>`;
  mn.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{US.group=b.dataset.g;US.page=0;users()});
  const go=()=>{US.q=$("#fq").value.trim();US.parent=$("#fp").value.trim();US.per=+$("#fn").value;US.page=0;users()};
  $("#fs").onclick=go;$("#fn").onchange=go;$("#fc").onclick=()=>{US.q=US.parent="";US.page=0;users()};
  [$("#fq"),$("#fp")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
  $("#nw").onclick=createModal;if($("#mt"))$("#mt").onclick=mintModal;
  let r;try{r=await api("p_users",{group:US.group,q:US.q,parent:US.parent,limit:US.per,offset:US.page*US.per})}catch(e){if($("#tb"))$("#tb").innerHTML=`<tr><td colspan="8" class="neg">${E(e.message)}</td></tr>`;return}
  if(!$("#tb"))return; // cambiaste de pantalla mientras cargaba
  r.rows.forEach(u=>userRole[u.username]=u.role);
  $("#tb").innerHTML=r.rows.length?r.rows.map(u=>`<tr>
    <td class="mut">${u.id.slice(0,6)}</td>
    <td><b>${E(u.username)}</b> <span class="pill ${u.role}">${ROLE[u.role]}</span>${u.blocked?' <span class="pill off">Bloqueado</span>':""}${u.children?`<div class="mut" style="font-size:12px">${u.children} usuario${u.children>1?"s":""} a cargo</div>`:""}</td>
    <td>${u.direct?`<div class="act"><button class="btn ok s" data-d="${E(u.username)}">Depositar</button><button class="btn bad s" data-r="${E(u.username)}">Retirar</button></div>`:'<span class="mut" style="font-size:12px">lo maneja '+E(u.parent||"—")+"</span>"}</td>
    <td class="n"><b>${N(u.balance)}</b>${Number(u.held)?`<div class="mut" style="font-size:12px">${N(u.held)} en mesas</div>`:""}</td>
    <td class="n">${u.role==="player"?'<span class="mut">—</span>':N(u.commission_pct)+" %"}${u.earned>0?`<div class="mut" style="font-size:12px">ganó ${N(u.earned)}</div>`:""}</td>
    <td>${E(u.parent||"—")}</td><td class="mut">${dt(u.created_at)}</td>
    <td><div class="act"><button class="btn g s" data-k="${E(u.username)}">Copiar acceso</button><button class="btn g s" data-m="${E(u.username)}">Movimientos</button><button class="btn g s" data-e="${E(u.username)}">Editar</button><button class="btn s ${u.blocked?"ok":"g"}" data-b="${E(u.username)}" data-v="${u.blocked?0:1}">${u.blocked?"Desbloquear":"Bloquear"}</button></div></td></tr>`).join(""):`<tr><td colspan="8" class="mut" style="padding:24px;text-align:center">No hay usuarios todavía. Creá el primero con “+ Crear usuario”.</td></tr>`;
  const pages=Math.max(1,Math.ceil(r.total/US.per));
  $("#pg").innerHTML=`<button class="btn g s" id="pp" ${US.page<=0?"disabled":""}>‹</button><span class="mut">Página ${US.page+1} de ${pages} · ${r.total} usuarios</span><button class="btn g s" id="pn" ${US.page+1>=pages?"disabled":""}>›</button>`;
  $("#pp").onclick=()=>{US.page--;users()};$("#pn").onclick=()=>{US.page++;users()};
  const k=(l,v)=>`<div class="kp"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  $("#tt").innerHTML=k("Total de usuarios",N(r.total,0))+k("Jugadores",N(r.players,0))+k("Agentes",N(r.agents,0))+k("Balance total",CR(r.sum_balance))+k("En mesas",CR(r.sum_held));
  const T=$("#tb");
  T.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.d)moveModal(b.dataset.d,"deposito");else if(b.dataset.r)moveModal(b.dataset.r,"retiro");
    else if(b.dataset.k)accessModal(b.dataset.k,userRole[b.dataset.k]);
    else if(b.dataset.m){view="tx";TXS.user=b.dataset.m;TXS.page=0;shell()}
    else if(b.dataset.e)editModal(r.rows.find(x=>x.username===b.dataset.e));
    else if(b.dataset.b){const bl=b.dataset.v==="1";if(bl&&!confirm("¿Bloquear a "+b.dataset.b+"? Si es agente, también se bloquea todo su equipo."))return;
      try{await api("p_update",{username:b.dataset.b,set:{blocked:bl}});toast(bl?"Bloqueado":"Desbloqueado");users()}catch(er){toast(er.message)}}};
}

}

  <p class="mut">Cada vez que cargás créditos a una plataforma queda una venta al precio de esa plataforma. Si le retirás créditos, se descuenta (devolución).</p>`;
}

/* ---------- configuración (solo padre) ---------- */
async function cfg(){
  const s=await api("p_settings",{});CFG=s;
  $("#mn").innerHTML=`<div class="top"><h2>Configuración del juego</h2></div><div class="card" style="max-width:560px">
  <div class="two"><div><label>Apuesta mínima (cr)</label><input id="c1" value="${s.min_stake}"></div><div><label>Apuesta máxima (cr)</label><input id="c2" value="${s.max_stake}"></div></div>
  <div class="two"><div><label>Comisión de la mesa (% del pozo)</label><input id="c3" value="${s.rake_pct}"></div><div><label>Seg. por jugada</label><input id="c4" value="${s.move_secs}"></div></div>
  <div class="two"><div><label>Apuesta máx. vs máquina (0 = práctica)</label><input id="c5" value="${s.bot_max_stake}"></div><div><label>Precio por defecto ($ por millón)</label><input id="c6" value="${s.default_price}"></div></div>
  <div class="two"><div><label>Nivel de la máquina (0–100)</label><input id="c10" value="${s.bot_skill}"></div><div><label>Pago al ganar contra la máquina (1,00–2,00 ×)</label><input id="c11" value="${s.bot_payout}"></div></div>
  <div class="two"><div><label>Puntos</label><select id="c7"><option ${s.target==15?"selected":""}>15</option><option ${s.target==30?"selected":""}>30</option></select></div><div><label>Flor</label><select id="c8"><option value="1" ${s.flor?"selected":""}>Con flor</option><option value="0" ${!s.flor?"selected":""}>Sin flor</option></select></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="c9" style="width:auto" ${s.maintenance?"checked":""}> Modo mantenimiento (nadie puede crear mesas)</label>
  <div class="err" id="e"></div><button class="btn" id="ok" style="margin-top:8px">Guardar</button></div>
  <p class="mut" style="max-width:560px">La comisión de la mesa se reparte hacia arriba: cada agente se queda con la diferencia entre su % y el de su agente directo, y el padre con lo que sobra.</p>`;
  const n=v=>Number(String(v).replace(",","."));
  $("#ok").onclick=async()=>{try{CFG=await api("p_settings",{set:{min_stake:n($("#c1").value),max_stake:n($("#c2").value),rake_pct:n($("#c3").value),move_secs:n($("#c4").value),bot_max_stake:n($("#c5").value),bot_skill:n($("#c10").value),bot_payout:n($("#c11").value),default_price:n($("#c6").value),target:+$("#c7").value,flor:$("#c8").value==="1",maintenance:$("#c9").checked}});toast("Guardado")}catch(e){$("#e").textContent=e.message}};
}
start();
</script></body></html>
